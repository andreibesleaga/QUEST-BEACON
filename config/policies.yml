# BEACON — policy-as-code instance for the AICompliancePort gateway
# ---------------------------------------------------------------------------
# Validated against: schemas/policies.schema.json (JSON Schema draft 2020-12)
# Enforced by:       the AICompliancePort reverse-proxy gateway (ADR-017) in
#                    front of EVERY LLM + Vision call; cost guardrails (ADR-018);
#                    observability/cost-attribution (ADR-022).
# Loaded fail-fast at boot (CONFIGURATION U5/F10), like REGIONS_CONFIG.
# SAFETY controls (pii, content_safety) are FAIL-CLOSED; the budget posture is
# soft-within-budget and HARD-BLOCK + human approval only above a threshold/cap.
# Standards: OWASP LLM Top-10 2025 + OWASP ASI01-ASI10, NIST AI RMF, ISO/IEC
# 42001, EU AI Act Art.12-15, MITRE ATLAS. See docs/architecture/COMPLIANCE_MATRIX.md.
# ---------------------------------------------------------------------------

version: '2026.06.29'

# --- RBAC scope per role (THREAT_MODEL TB6; CLARIFICATIONS §B.Q6) -----------
# Deny-by-default: a role only reaches the models/tools listed here, capped by
# max_tokens. BEACON's LLM has NO tools (narration only) so allowed_tools is
# empty for every role (least privilege, LLM06 / OWASP ASI02).
roles:
  em: # Emergency Manager — full AI access in region
    allowed_models: ['*']
    allowed_tools: []
    max_tokens: 1500
  verifier: # triage / approve-CAP — drives SitRep synthesis + advisory vision-assist
    allowed_models: ['default', 'fallback', 'local', 'vision']
    allowed_tools: []
    max_tokens: 1500
  responder: # own-org logistics — narration only, smaller cap
    allowed_models: ['default', 'local']
    allowed_tools: []
    max_tokens: 800
  public: # anonymous COP read — no privileged model access
    allowed_models: ['local']
    allowed_tools: []
    max_tokens: 400

# --- PII detect + redact (THREAT_MODEL §11; Art. IV/XIV) — FAIL-CLOSED ------
# No raw PII ever enters the prompt context sent upstream (LLM02/LLM06).
pii:
  action: redact # reversible high-entropy token swap before egress
  patterns:
    - name: email
      regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    - name: ssn
      regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    - name: phone
      regex: "\\b(?:\\+?1[ .-]?)?\\(?\\d{3}\\)?[ .-]?\\d{3}[ .-]?\\d{4}\\b"
    - name: credit-card
      regex: "\\b(?:\\d[ -]*?){13,16}\\b"
    # ADDED 2026-08-01 (F-347 sibling). The four patterns above are the generic identity set; NONE of them
    # matches a coordinate — so a reporter who types "I'm at 38.5816, -121.4944" into an SOS free-text field
    # sent that precise location to a cloud LLM unredacted. That is the exact disclosure Art. XIV forbids
    # (precise location is responder-authenticated-view only), arriving through the one field the schema
    # cannot constrain. The structured `geomPrecise` path was already gated; free text was not.
    #
    # Deliberately requires BOTH halves of a pair separated by a comma/whitespace, with a decimal point on
    # each: a lone "38.5816" is a crest height, a wind speed or an acreage far more often than a latitude,
    # and redacting every decimal number would strip the cited facts the narration is grounded in.
    # Latitude is bounded to ±90 and longitude to ±180 so ordinary number pairs do not match.
    - name: coordinate-pair
      regex: "[-+]?(?:[0-8]?\\d|90)\\.\\d{3,}\\s*[,;]?\\s+[-+]?(?:1[0-7]\\d|[0-9]?\\d|180)\\.\\d{3,}"
    # Degrees-minutes-seconds, the other way a person writes a position by hand.
    - name: coordinate-dms
      regex: "(?i)\\b\\d{1,3}°\\s*\\d{1,2}['′]\\s*[\\d.]+[\"″]?\\s*[NS][ ,]+\\d{1,3}°\\s*\\d{1,2}['′]\\s*[\\d.]+[\"″]?\\s*[EW]\\b"

# --- Semantic firewall (ADR-017) — FAIL-CLOSED -----------------------------
# Ingested NL is untrusted DATA, never instructions (THREAT_MODEL §10.2 / LLM01).
content_safety:
  prompt_injection: true
  blocked_command_patterns:
    - name: destructive-shell
      regex: "(?i)\\b(rm\\s+-rf|mkfs|:\\(\\)\\s*\\{|shutdown|reboot)\\b"
    - name: sql-destructive
      regex: "(?i)\\b(drop|truncate)\\s+(table|database)\\b"
    - name: ssrf-metadata
      regex: "(?i)(169\\.254\\.169\\.254|metadata\\.google\\.internal|file://|gopher://|http://localhost(:\\d+)?/)"
    - name: secret-file-access
      regex: "(?i)(/etc/passwd|/etc/shadow|(^|/)\\.env(\\.|$)|id_rsa|\\.aws/credentials)"

# --- Rate limit at the gateway (THREAT_MODEL T1.6; OWASP API4 / LLM10) ------
rate_limit:
  window_ms: 60000 # 1-minute sliding window
  max_requests: 60 # per caller/role; exceed -> 429 Retry-After

# --- Cost guardrails + budget posture (ADR-018) ----------------------------
# SOFT within budget (auto + per-call audit + pre-step reservation); HARD-BLOCK
# + human approval only above escalation_threshold_usd or a cap. Safety is always
# fail-closed regardless of budget.
budget:
  per_incident_usd: 5.00 # hard cap per incident
  per_region_usd: 50.00 # hard cap per region per budget period
  escalation_threshold_usd: 0.50 # soft escalation / HITL trigger per call
  require_human_above_threshold: true

# --- EU AI Act transparency + record-keeping (Art.12/13/50) ----------------
eu_ai_act:
  transparency_headers: true # AI-involvement marker on AI-derived responses
  log_retention_days: 365 # hash-chained audit trail retention (UUIDs only)

# --- Optional circuit-breaker override (SPEC §8.1; ADR-018) ----------------
circuit_breaker:
  failure_threshold: 5
  open_duration_ms: 60000
