# BEACON — OSV-Scanner policy. npm audit gates production dependencies at high severity; OSV-Scanner scans
# the full lockfile, so known-accepted DEV-ONLY advisories are recorded here with their reasons and expiry.
# Review on every dependency update; remove an entry the moment the fix lands.

[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
reason = "esbuild <=0.25.0 dev-server CORS advisory (CVSS 5.3, Medium). Dev-only transitive dependency (vite/vitest toolchain); the esbuild dev server is never exposed in this project and never ships in the production build. Below the documented high+ gate. Fix requires a toolchain major bump — tracked for the next dependency window."

[[IgnoredVulns]]
id = "GHSA-82fw-gwwq-j7x9"
ignoreUntil = 2027-02-01
reason = "Vitest / @vitest/mocker 3.2.7 (CVSS 5.9, Medium), fixed in 4.1.11. DEV-ONLY: vitest is a devDependency, is never installed in the runtime image (infra/Dockerfile runs `npm ci --omit=dev`) and ships in no production artifact. The Vitest 3 → 4 major upgrade changes V8 coverage results and requires a deliberate test/coverage migration; keep this expiring exception until that dedicated dependency window. Re-measured 2026-11-21 with Vitest 5.1.1: all 5,448 tests pass, but its V8 coverage remapping reads src/application branches 98.61 %, src/main lines 95.58 % and app branches 83.08 % - under three enforced floors with no code change. Floors are never lowered, so the exception is extended, not the floors."

