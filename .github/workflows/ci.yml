# BEACON — PR-blocking CI. Phase 1 of docs/CI_CD_PLAN.md (only checks verified green on this tree).
#
# TODO(pin): replace every `@vN` below with a full commit SHA before enabling on a protected branch
#   (offline: SHAs not resolvable here). Tracking checklist: .github/PINNING_CHECKLIST.md.
#   Rationale: OpenSSF Scorecard "Pinned-Dependencies" / supply-chain integrity — a floating tag is
#   mutable. Every third-party action is pinned to its MAJOR version tag as an interim measure.
#
# Phase-2 gates NOT wired here (they need npm scripts / tools that do not exist yet — see
# docs/CI_CD_PLAN.md §2/§3 and .github/PINNING_CHECKLIST.md): CodeQL + Semgrep (SAST),
# Trivy (container scan), api-extractor (API-surface snapshot), micro-benchmark (bench:ci),
# BDD-per-FR (test:bdd), compliance (test:compliance/budget/cost-attribution), Tier-1 evals.
# They graduate in from the nightly TODO block once their scripts/tools are added and calibrated.

name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

# Least privilege by default; a job raises its own scope only where it must.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # Gate 1 (lint/format), Gate 2 (types), Gate 6 (boundaries/complexity).
    name: static (type · lint · format · boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # format:check is non-blocking on the first runs: the tree was formatted under prettier 3.4.x
      # but the lockfile drifted to 3.9.x (which reformats). Resolve deliberately (pin prettier to the
      # formatted version, or run `npm run format` once) then drop continue-on-error. See MASTER_PLAN Phase A.
      - run: npm run format:check
        continue-on-error: true
      - run: npm run boundaries

  unit:
    # Gate 3 — vitest with coverage. vitest.config.ts fails the run under the 99% floor
    # on domain + application (this is the enforcement, not a claim).
    name: unit (coverage ≥99% domain+application)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  integration:
    # Gate 4 — ephemeral Postgres 16, apply Drizzle migrations, assert they landed (19 tables).
    name: integration (postgres migrate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: beacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/beacon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run migrate
      # ASSERT THE TABLE SET, DERIVED — not a hardcoded count (2026-09-11).
      #
      # This step used to assert `COUNT = 19`. The schema grew to 23 tables and the literal was never
      # updated, so the integration lane went red on a migration run that had just reported "migrations
      # applied successfully". A number typed into a workflow is a fact about the day it was typed.
      #
      # The expected set is now DERIVED from the migration SQL itself, so it cannot go stale: CI compares
      # what the database actually has against what the committed migrations say they create. It is also a
      # stronger check than a count, which cannot notice a table being renamed — one appears, one
      # disappears, and the total is unchanged.
      #
      # DROP TABLE is subtracted, so a future migration that removes a table does not leave this asserting
      # against a ghost. There are no DROPs today.
      - name: Assert the migrated table set matches the migrations
        run: |
          EXPECTED=$(cat <(grep -rhoiP 'CREATE TABLE (IF NOT EXISTS )?"?\K[a-z_]+' drizzle/*.sql) \
                     <(grep -rhoiP 'DROP TABLE (IF EXISTS )?"?\K[a-z_]+' drizzle/*.sql | sed 's/^/!/') \
                     | awk '/^!/ { dropped[substr($0,2)]=1; next } { created[$0]=1 }
                            END { for (t in created) if (!(t in dropped)) print t }' | sort -u)
          ACTUAL=$(psql "$DATABASE_URL" -tAc \
            "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1;" \
            | tr -d '[:blank:]' | grep -v '^$' | sort -u)
          # An EMPTY expected set must fail loudly. Without this the check passes whenever the grep finds
          # nothing — a moved directory, a renamed file — which is the failure mode that first shipped here:
          # the job ran, reported "expected 1 tables", and would have gone green against an empty database.
          test -n "$EXPECTED" || { echo "::error::no CREATE TABLE found in drizzle/*.sql — the check is not looking where it thinks"; exit 1; }
          echo "expected $(echo "$EXPECTED" | wc -l) tables, found $(echo "$ACTUAL" | wc -l)"
          diff <(echo "$EXPECTED") <(echo "$ACTUAL") || {
            echo "::error::the migrated schema does not match the committed migrations (< expected, > actual)"
            exit 1
          }
      - name: Assert latest migration columns landed (a table COUNT cannot catch a skipped ALTER)
        # 0006 was once hand-added without a journal entry, so the migrator silently skipped it and the
        # table count still read 19 — the SOS intake column was missing on every fresh database. Assert
        # the newest column(s) by NAME so an unjournaled migration can never pass this gate again.
        run: |
          HAS=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='public_report' and column_name='report_text';")
          HAS=$(echo "$HAS" | tr -d '[:space:]')
          echo "public_report.report_text present: $HAS (expected 1)"
          test "$HAS" = "1"

  browser:
    # Gate 8 / F13 / F14 — Playwright golden-path e2e + axe WCAG 2.2 AA + TTTP perf budget.
    # playwright.config.ts builds AND starts the production server itself (offline seed, MOCK sources,
    # AUTH_DEV_TRUST_HEADER=on), so this job only installs the browser and runs the suite.
    name: browser (playwright e2e · axe · perf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  security:
    # Gate 5 (SCA + secrets). NON-BLOCKING on purpose for now ("earn the right to block"):
    # a scanner quirk / rate-limit must not red the very FIRST CI run. These graduate to blocking
    # (drop continue-on-error) once calibrated on real runs. Documented in docs/CI_CD_PLAN.md §3.
    # Each scanner must also continue on error so findings do not skip the remaining scans.
    name: security (audit · gitleaks · osv) [non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API; without pull-requests:read it dies on a 403
      # inside octokit (found on the first run of this lane, 2026-08-24). The top-level default is
      # contents:read only, so the job must raise its own scope.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan commits
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit (production high+)
        continue-on-error: true
        # The runtime image uses `npm ci --omit=dev`; OSV-Scanner below still checks the full lockfile.
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (secret scan)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # NOT `uses: google/osv-scanner-action@vN` — that repo's action.yml is a STUB with no `runs:`
      # section at any tag, so the step could never resolve. This was latent here for as long as the file
      # existed and was only discovered on 2026-08-24, when the monorepo wrapper made these workflows
      # execute for the first time (`Unable to resolve action ... unable to find version v2`). Its
      # supported form is a reusable workflow requiring `security-events: write` for SARIF upload; the
      # official container needs neither and was verified locally before commit.
      - name: OSV-Scanner (lockfile CVEs)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/google/osv-scanner:v2.5.1 \
            scan source --lockfile=/src/package-lock.json
