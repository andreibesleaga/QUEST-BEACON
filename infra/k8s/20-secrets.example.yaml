# BEACON — SECRET TEMPLATE. Copy to 20-secrets.yaml (gitignored pattern: *secrets.yaml), fill in, apply.
# Never commit a filled copy. Prefer an external secret manager (External Secrets, Sealed Secrets, Vault)
# in production — this file only shows the keys the app reads.
apiVersion: v1
kind: Secret
metadata:
  name: beacon-secrets
  namespace: beacon
type: Opaque
stringData:
  # Postgres — either the in-cluster StatefulSet below or a managed database URL
  DATABASE_URL: 'postgres://beacon:CHANGE_ME@beacon-postgres:5432/beacon'
  POSTGRES_PASSWORD: 'CHANGE_ME'
  # Auth: scrypt-derived per-user credentials; passwords are never stored
  AUTH_SECRET: 'CHANGE_ME_64_random_chars_minimum'
  AUTH_USERS: 'em@your-agency.example:EM:CHANGE_ME,verifier@your-agency.example:VERIFIER:CHANGE_ME,responder@your-agency.example:RESPONDER:CHANGE_ME'
  # Optional free-tier keys (leave empty to keep that source CACHED/MOCK)
  FIRMS_MAP_KEY: ''
  OPENAQ_API_KEY: ''
  OPENCELLID_API_KEY: ''
  WINDY_WEBCAMS_API_KEY: ''
  EARTHDATA_TOKEN: ''
  ORS_API_KEY: ''
  OPENROUTER_API_KEY: ''
  GROQ_API_KEY: ''
  TELEGRAM_BOT_TOKEN: ''
  TELEGRAM_ALERT_CHAT_IDS: ''
