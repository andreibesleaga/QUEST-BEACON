        `count: 0`; that is an honest empty configuration, not an error.

        There is no mutation counterpart in v1: rules are config-seeded. Firing a rule creates a DRAFT
        alert and nothing else (Art. XIII).

        `provenance[]` names the CONFIGURATION (`threshold-rule-config`, mode `LIVE`), not an upstream
        feed — attributing configuration to a data source would misreport where it came from.
      x-required-role: EM
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
