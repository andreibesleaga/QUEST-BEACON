      operationId: getEdxlResourceMessage
      tags: [Interop]
      summary: Export an EDXL-RM message (round-trip read)
      description: |
        EV10 / FR-9. Returns the EDXL-RM message and the full mutual-aid round-trip chain
        (request → commit → response) it belongs to. Role RESPONDER (own-org; org-ownership
        checked) or EM (CLARIF §B.Q6, SPEC §2.2/§7.2).
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: EDXL-RM message with its round-trip chain.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EdxlRmRoundTrip' }
            application/xml:
              schema: { $ref: '#/components/schemas/EdxlRmMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /edxl/sitrep:
    post:
      operationId: postEdxlSitrep
      tags: [Interop]
      summary: Export an EDXL-SitRep situation summary
      description: |
        EV10 / FR-9. Serializes an incident situation summary as EDXL-SitRep 1.0 for
        inter-agency exchange. Role EM. Writes AUDIT_EVENT.
      x-required-role: EM
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdxlSitrepCreate' }
      responses:
        '201':
          description: EDXL-SitRep created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EdxlSitrep' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me:
    get:
      operationId: getCurrentUser
      tags: [Regions]
      summary: Get the authenticated caller's role (+ JWT subject)
      description: |
        Returns the caller's effective role and, when authenticated via JWT, the verified `sub` identity.
        Operational identity endpoint — a bare object, NOT the data envelope (like `/health`); it carries
        no data-plane content, so provenance/freshness do not apply. Any authenticated role.
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The caller's role (and JWT `sub` when present).
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { type: string, enum: [PUBLIC, RESPONDER, VERIFIER, EM] }
                  sub:
                    {
                      type: string,
                      description: Verified per-user JWT subject (absent for header/session trust).,
                    }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login:
    post:
      operationId: login
      tags: [Regions]
      summary: Named-account sign-in — mint a session bearer JWT for a CONFIGURED account
      description: |
        `src/adapters/channels/http/routing.ts` `loginCommand` + `http-dispatcher.ts` `handleLogin`.
        The REAL auth surface, and the one a deployed BEACON uses: unlike `POST /auth/dev-login` it is
        **available in every posture including `DEPLOY_MODE=cloud`**, because it grants only the role the
        configured account already carries — the request cannot ask for a role at all.

        Accounts come from `AUTH_USERS` (`id:ROLE:password` triples). Passwords are never stored or
        compared as plaintext: each is stretched with scrypt under a salt bound to `AUTH_SECRET` and
        compared with `timingSafeEqual`; an unknown user still performs a full derivation so response
        timing cannot enumerate accounts. The minted JWT's `sub` is the real account id, so the
        hash-chained triage audit records a PERSON rather than `role:<ROLE>`.

        **Disabled** (generic, non-disclosing 404) when `AUTH_SECRET` is unset or no accounts are
        configured — the offline/e2e posture, which keeps those flows on the dev header.
      x-required-role: PUBLIC
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, password]
              properties:
                userId: { type: string, description: The configured account id. }
                password: { type: string, format: password }
      responses:
        '200':
          description: Signed in; a 12-hour session bearer is returned.
          content:
            application/json:
              schema:
                type: object
                required: [token, role, userId]
                properties:
                  token:
                    { type: string, description: '12h HS256 bearer JWT; `sub` is the account id.' }
                  role:
                    type: string
                    enum: [RESPONDER, VERIFIER, EM]
                    description: The role the ACCOUNT carries — never one the request asked for.
                  userId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Invalid credentials. Deliberately identical for "no such user" and "wrong password" so the
            endpoint cannot be used to enumerate accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            Login disabled (no `AUTH_SECRET` or no configured accounts) — a generic `NOT_FOUND` body
            identical to an unrouted path (non-disclosing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/dev-login:
    post:
      operationId: devLogin
      tags: [Regions]
      summary: Demo IdP — mint a short-lived role-scoped bearer JWT (NOT production issuance)
      description: |
        `src/adapters/channels/http/routing.ts` `devLoginCommand` + `http-dispatcher.ts` `handleDevLogin`
        (ADR-025). Mints a 1-hour HS256 JWT `{role, sub:userId}` for the offline/e2e demo posture —
        **never a real IdP**. Added to this document 2026-07-15 (W5 audit-debt sweep); the route has
        been served since Phase-B but was missing from the spec (OpenAPI drift).

        **Hard-off** (generic 404, non-disclosing) whenever `NODE_ENV=production` or
        `DEPLOY_MODE=cloud`, and opt-in even in dev/local: requires BOTH `AUTH_SECRET` set AND
        `AUTH_DEV_LOGIN=on` explicitly. With no secret / not enabled / prod / cloud, the response is
        the SAME generic `{errors:[{code:'NOT_FOUND', message:'no such route'}]}` body as any unknown
        route — posture is never disclosed by the shape of the 404.
      x-required-role: PUBLIC
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, userId]
              properties:
                role:
                  type: string
                  enum: [PUBLIC, RESPONDER, VERIFIER, EM]
                userId:
                  type: string
                  description: Becomes the JWT `sub` claim (the demo per-user identity).
      responses:
        '200':
          description: Token minted (demo IdP only).
