      description: EV9 / FR-8. Role RESPONDER (own org) or EM.
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [AVAILABLE, ASSIGNED, OOS] }
        - name: org
          in: query
