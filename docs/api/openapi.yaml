        shelter(s). Routing degrades ORS → Valhalla/OSRM → straight-line+avoid heuristic
        (FEATURE_ROUTING); the chosen engine is reported in `meta.routingEngine`.
      x-required-role: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '201':
          description: Route created (avoids hazard) with nearest shelters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EvacRoute' }
                      meta:
                        type: object
                        properties:
                          routingEngine:
                            type: string
                            enum: [ors, valhalla, osrm, heuristic]
                          nearestShelters:
                            type: array
