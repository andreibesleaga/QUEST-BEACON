        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: registerResource
      tags: [Resources]
      summary: Register a resource
      description: EV9 / FR-8. RESPONDER may register for their own org; EM for any org. Writes AUDIT_EVENT.
