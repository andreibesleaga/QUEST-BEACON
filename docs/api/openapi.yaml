  /resource-tasks:
    post:
      operationId: createResourceTask
      tags: [Resources]
      summary: Task a resource to an incident
      description: |
        EV9 / FR-8. Creates a RESOURCE_TASK in the lifecycle
        PROPOSED→TASKED→ENROUTE→ONSCENE→CLEARED. A task may NOT originate from an
        UNVERIFIED/TRIAGED report (ST1/UW5). Role RESPONDER (own org) or EM. Writes AUDIT_EVENT.
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
