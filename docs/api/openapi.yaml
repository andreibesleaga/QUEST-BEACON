# BEACON — OpenAPI 3.1 specification (GABBE SDLC S03)
#
# Browser-based Emergency Awareness & Coordination Open Network.
# Authored by the prod-tech-lead persona from:
#   - docs/requirements/PRD.md          (§5 EARS, §8 API sketch)
#   - docs/architecture/DOMAIN_MODEL.md (entities → schema components)
#   - docs/architecture/CONFIGURATION.md
#   - audit/CLARIFICATIONS.md           (§B.Q6 RBAC matrix)
#
# CONTRACT INVARIANTS encoded here (DOMAIN_MODEL §6, AGENTS §4/§14):
#   - Every data response carries `provenance[]` (→ SOURCE_RECORD) + `freshness` (U1).
#   - Every SitRep response additionally carries `citations[]` (U2).
#   - No number/ranking/distance/exposure is LLM-produced (U3) — fields are deterministic.
#   - No ALERT reaches ACTUAL without `approvedBy` (Art. XIII / ST1 / UW5).
#   - `geomPrecise` (precise PII location) is responder-only (ST3 / Art. XIV).
#   - Degraded data GETs return 200 + envelope `meta.status=degraded` carrying last-known-good
#     cache/mock (UW2 / OP3 — never a dead-end). 503 is reserved for the genuine total-outage /
#     no-fallback case (no cache, no mock).
#
# RBAC (CLARIFICATIONS §B.Q6) is expressed two ways per operation:
#   - the `security` block (which auth is accepted), and
#   - an `x-required-role` extension + a tag naming the minimum role.

openapi: 3.1.0

info:
  title: BEACON API
  version: 1.0.0
  summary: Common operating picture, situational intelligence, SOS intake, and responder logistics for wildfires and floods.
  description: |
    BEACON is an open-source, local-first, near-real-time common operating picture (COP)
    for wildfires and floods. It unifies free/authoritative data behind a pluggable adapter
    spine, computes exposure/risk deterministically, narrates it as a source-cited AI
    situational report, and ties it to responder logistics.

    ## Response envelope
    Every successful data response uses the universal envelope:
    `{ data, provenance[], freshness, meta?, errors? }`. `provenance[]` (→ `SourceRef`)
    and `freshness` (ISO-8601 timestamp) are **mandatory** on all data responses.
    A SitRep response additionally carries `citations[]` (→ `Citation`).

    ## Determinism
    All numbers, rankings, distances, exposures, crest values, and scores are computed
    deterministically (Turf.js / SQL / typed code). The LLM only narrates cited facts.

    ## Degradation (last-known-good)
    When a source is degraded but a fallback rung (last-known-good cache or recorded mock)
    exists, data GETs return **200** with `meta.status=degraded` (and `meta.degraded=true`);
    `provenance[]` + `freshness` still describe the cache/mock served. Never a dead-end
    (UW2 / OP3). A **503** is returned ONLY for a genuine total outage where no fallback rung
    exists (no cache, no mock) — `meta.status=unavailable`.

    ## Authorization
    Roles (ascending privilege): `PUBLIC`, `RESPONDER`, `VERIFIER`, `EM`.
    See the per-operation `x-required-role` extension and the RBAC matrix in
    `audit/CLARIFICATIONS.md` §B.Q6.

    ## Envelope canonicity (single source of truth)
    This document (`docs/api/openapi.yaml`) is the **canonical** definition of the API-boundary
    response envelope (`ResponseEnvelope` / `SourceRef`). `schemas/source-ref.schema.json` is the
    contract-test / adapter-internal copy of the same envelope. CI MUST assert parity between the
    two so they never drift.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: BEACON team
    url: https://github.com/IEEE/Quest

servers:
  - url: http://localhost:3000/api/v1
    description: Local / air-gapped (docker compose up)
  - url: https://{host}/api/v1
    description: Cloud free-tier deployment
    variables:
      host:
        default: beacon.example.org

tags:
  - name: Regions
    description: Region registry and incidents (role PUBLIC).
  - name: Incidents
    description: Incident detail, SitRep, exposure (role PUBLIC).
  - name: Reports
    description: Consented SOS intake and verification lifecycle.
  - name: Routing
    description: Hazard-avoiding evacuation routes (role PUBLIC).
  - name: Resources
    description: Resource registry and tasking (role RESPONDER/EM).
  - name: Alerts
    description: CAP v1.2 alert emission (role VERIFIER/EM).
  - name: Interop
    description: EDXL-RM mutual-aid round-trip and EDXL-SitRep (role EM).
  - name: Stream
    description: SSE delta channel keyed by region (role PUBLIC).
  - name: Channels
    description: |
      Inbound driving adapters for non-web channels (ADR-023). Currently: the Telegram Bot API
      webhook. Shares the same `InteractionPort` core as every other channel (zero core change).
  - name: Sustainability
    description: |
      Out-of-band, machine-readable energy/carbon disclosure (ADR-020). Served at the origin root
      `/.well-known/sustainability` (RFC 8615), NOT under `/api/v1`. Modeled/estimated values, heavily cached.
  - name: System
    description: Operational health of source adapters — backs the stale/unavailable UI badge (role PUBLIC).

# Default security: most reads accept PUBLIC (anonymous) OR an authenticated session/JWT.
# Operations that require a role override this with their own `security` + `x-required-role`.
security:
  - {}
  - sessionAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Regions]
      summary: Process liveness probe
      description: |
        Bare liveness check for orchestrators (docker healthcheck). A plain object, NOT the data
        envelope — it carries no data-plane content. Unauthenticated by design.
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /status:
    get:
      operationId: getStatus
      tags: [Regions]
      summary: Region monitor overview (incident counts + headlines)
      description: |
        The `status` Command verb (`src/application/interaction/command-router.ts` `handleStatus`) —
        the SAME dispatch every channel (HTTP/CLI/messaging) shares (ADR-023). Returns the region's
        incident count plus a lightweight per-incident summary (id/type/status/headline). Role PUBLIC.
        Added to this document 2026-07-15 (W5 audit-debt sweep) — the route has been served since S05
        but was missing from the spec (OpenAPI drift).
      x-required-role: PUBLIC
      parameters:
        - name: regionId
          in: query
          required: false
          description: Defaults to the deployment's configured default region.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Region status overview with provenance + freshness (non-empty even with 0 incidents, F1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [regionId, incidentCount, incidents]
                        properties:
                          regionId: { type: string, format: uuid }
                          incidentCount: { type: integer }
                          incidents:
                            type: array
                            items:
                              type: object
                              required: [id, type, status, headline]
                              properties:
                                id: { type: string, format: uuid }
                                type: { type: string, enum: [WILDFIRE, FLOOD] }
                                status: { type: string, enum: [ACTIVE, CONTAINED, CLOSED] }
                                headline: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /regions:
    get:
      operationId: listRegions
      tags: [Regions]
      summary: List configured regions
      description: |
        EV1 — the shipped-zone registry a client reads instead of hardcoding the regions it knows
        (FR-ZONE-1, ADR-031 §Decision-4). Role PUBLIC: this is identity, geography and locale
        metadata only. It deliberately does **not** expose `enabled_adapters` or
        `source_mode_overrides` — those are operational posture, and `GET /sources` is the
        provenance-transparency surface for per-source LIVE/CACHED/MOCK modes.

        SERVED since 2026-07-27 (backlog B1.2, finding F-01) via the `regions` command verb
        (`src/ports/interaction.ts`) routed in `src/adapters/channels/http/routing.ts` and handled in
        `src/application/interaction/command-router.ts` over the injected `RegionReadModel`. The
        collection takes NO parameters: the registry is deployment-wide, so a `regionId` filter on the
        list of regions would be circular.

        `provenance[]` carries exactly one entry, `sourceId: region-registry`, `mode: LIVE`, whose
        `fetchedAt` (= `freshness`) is the server clock at read time: this data comes from the
        deployment's own region configuration, not from an upstream feed, so it is never attributed to
        one. For the same reason there is no degraded/unavailable rung here — no source is fetched, so
        this endpoint does not return `meta.status=degraded` or 503.
      x-required-role: PUBLIC
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: |
            The configured regions, wrapped in the standard envelope with `provenance[]` + `freshness`.
            In the default (config-backed) profile they are returned in registry order —
            `config/regions.json` order, which is also the client's selector order; the
            `FEATURE_STORE=postgres` projection returns them in table order, so a client that cares
            about ordering must not rely on it as a contract.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [regions]
                        properties:
                          regions:
                            type: array
                            description: |
                              Empty array when the deployment configures no region (still a 200 with
                              non-empty `provenance[]`).
                            items: { $ref: '#/components/schemas/Region' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /regions/{id}/incidents:
    parameters:
      - $ref: '#/components/parameters/RegionId'
    get:
      operationId: listRegionIncidents
      tags: [Regions]
      summary: List incidents in a region
      description: EV1 — load all relevant incidents/layers for the selected region. Role PUBLIC.
      x-required-role: PUBLIC
      parameters:
        - $ref: '#/components/parameters/IncidentStatusFilter'
        - $ref: '#/components/parameters/IncidentTypeFilter'
      responses:
        '200':
          description: |
            Incident collection with provenance + freshness. Degraded sources (cache/mock
            available) still return **200** with `meta.status=degraded` (UW2).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Incident' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /incidents/{id}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: getIncident
      tags: [Incidents]
      summary: Get one incident record (the detail row of GET /regions/{id}/incidents)
      description: |
        SERVED (`src/adapters/channels/http/routes/incidents.ts` → `handleIncidentGet`, wired in the
        feature router's 2-segment GET table). Role **PUBLIC** — the same rank the `incidents` verb
        carries, so the detail read can never be looser than the collection it is a row of.

        The payload is the SAME `IncidentDetail` the collection serves as an element: the incident's
        identity, its engine-derived grounded `facts[]` and ranked `priorities[]`, plus `predictions[]`
        and `trend` when the derivation produced them. It is resolved through the shared core
        (`InteractionPort`), so there is exactly ONE declaration of the incident contract — this route
        does not carry a second copy of it.

        `?regionId=` is an OPTIONAL narrowing hint. An incident id carries no region, so when it is
        absent the configured region registry is walked in order; supplying it consults that region only
        (and 404s if that region does not hold the incident, rather than silently widening the search).
      x-required-role: PUBLIC
      parameters:
        - name: regionId
          in: query
          required: false
          description: Optional narrowing hint — consult only this region instead of the whole registry.
          schema: { type: string }
      responses:
        '200':
          description: |
            Incident detail with NON-EMPTY `provenance[]` + `freshness` (F1). Degraded sources
            (cache/mock available) still return **200**; the served mode rides `provenance[].mode`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /incidents/{id}/sitrep:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: getIncidentSitrep
      tags: [Incidents]
      summary: Get the cited AI situational report
      description: |
        EV3 / FR-4. Returns a generated SitRep with ranked priorities and escalation trend.
        Per U2 the SitRep response additionally carries `citations[]`, one per grounded field.
        If the LLM is unavailable the SitRep is returned in `aiMode=deterministic-only`
        (UW1/UW3): numbers and priorities are still present, narrative may be reduced.

        There is no `refresh` parameter: nothing is cached — EVERY read recomputes the report
        from current inputs, so a plain re-request IS the refresh. (A documented-but-unread
        `?refresh` param was removed 2026-08-10 rather than implemented as a no-op.)
      x-required-role: PUBLIC
      responses:
        '200':
          description: SitRep with provenance, freshness AND citations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitrepEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Generated SitRep failed citation/schema validation; deterministic fallback returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitrepEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /incidents/{id}/exposure:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: getIncidentExposure
      tags: [Incidents]
      summary: Get the deterministic exposure rows for an incident
      description: |
        EV2 / FR-3. SERVED (`src/adapters/channels/http/routes/incidents.ts` → `handleIncidentExposure`).
        Exposure rows are computed deterministically (Turf/SQL) — never by the LLM (U3).

        **The engine is not re-implemented here.** This route resolves the incident, then serves the
        exposure slice the COP derivation ALREADY computes — byte-identical to `GET /regions/{id}/map`
        `data.exposure[]` (pinned by test). Consequently the scope is stated honestly: the derivation
        derives exposure PER REGION (`MapSource` carries one `incidentType`), so these are the rows for
        the incident's region, reached by incident id — not a per-incident partition the engine does not
        compute.

        Role **PUBLIC** and role-INDEPENDENT: an exposure row names an INFRASTRUCTURE NODE and its
        relationship to a hazard — a public asset, never a person. The Art. XIV precise-geometry gate in
        `projectMap` applies to the `reports` slice, which this route does not serve.

        `?regionId=` is the same optional narrowing hint `GET /incidents/{id}` accepts.
      x-required-role: PUBLIC
      parameters:
        - name: regionId
          in: query
          required: false
          description: Optional narrowing hint — consult only this region instead of the whole registry.
          schema: { type: string }
      responses:
        '200':
          description: |
            Exposure collection with NON-EMPTY `provenance[]` + `freshness` (F1). Degraded sources
            (cache/mock available) still return **200**; the served mode rides `provenance[].mode`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IncidentExposure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such incident, OR the incident resolved but its region carries no COP source. The message
            names BOTH so the two cases are distinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /incidents/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: getIncidentSummary
      tags: [Incidents]
      summary: Incident-close export (CSV/JSON) of already-held aggregates
      description: |
        FR-D6-4 (ADR-035 §4; closes F-172/F-143/F-35). A thin adapter over the pure, already-guarded
        `buildIncidentSummary` (`src/application/aggregate/incident-summary.ts`): it reads ONLY figures
        BEACON already holds (alerts issued, tasks completed, shelter usage, affected area) and collects
        nothing new (FEV-28). **Aggregate-only (Art. XIV):** every response is re-verified at export time
        by a fail-closed runtime key walk (`guardAggregateOnly`, ADR-035 §4 Layer D) — a payload carrying
        a person-identifying field is BLOCKED (`422`) and the document is never returned beside the error.

        **`figures` query param (required):** a JSON-encoded object carrying the already-computed
        aggregate inputs (`alertsIssued`, `tasksCompleted` required; `regionId`, `closedAt`, `tasksTotal`,
        `sheltersOpen`, `shelterOccupancyPeak`, `shelterCapacityTotal`, `affectedAreaKm2`, `casualtyTally`
        optional; `provenance[]` required, non-empty). **Honest limitation:** no incident-scoped
        task/shelter/casualty aggregation store is reachable from the HTTP layer today (verified —
        `LogisticsAdapter` exposes no task-listing method, `findShelters` is a location-ranked lookup, not
        an incident-scoped inventory, and `makeCasualtyTally` has no adapter call site yet), so this route
        does not compute those figures itself; the caller (an EM/operator closing the incident) already
        holds them. `incidentId` (path) and `generatedAt` (the server's injected clock — Art. XII, never
        client-set) are supplied by the server, never the client.

        Response format is selected by `?format=csv|json` (default `json`); both carry a
        `Content-Disposition: attachment` header. CSV rendering reuses the shared RFC 4180 +
        OWASP-formula-injection-safe primitive built for the shelter-status export
        (`src/application/coordination/csv.ts`) — one document row (a summary is ONE incident) plus its
        header record.

        Gated behind `FEATURE_D6_INCIDENT_EXPORT` (**default ON**, `config/index.ts`). When OFF, this
        route returns the SAME generic 404 an unmatched route returns — it never confirms the route
        exists but is disabled (same posture as `POST /auth/dev-login` when unconfigured).
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: figures
          in: query
          required: true
          description: |
            JSON-encoded `IncidentSummaryWireFigures` (see description above) — the already-computed
            aggregate inputs `buildIncidentSummary` needs, everything except `incidentId`/`generatedAt`.
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: json }
      responses:
        '200':
          description: |
            The incident summary document. `application/json` carries the full `IncidentSummary` object
            (see `schemas/d6-incident-summary.schema.json`); `text/csv` carries one RFC-4180 header +
            data record. Both carry `Content-Disposition: attachment; filename="incident-<id>-summary.<ext>"`.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="incident-<incidentId>-summary.csv|json"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSummary' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Either a `buildIncidentSummary` invariant violation (bad/absent figures) OR Layer D's guard
            fired (a person-identifying field was present in the constructed document, e.g. a
            `casualtyTally.reporterId` bypassing the typed factory) — VALIDATION_ERROR either way; the
            document is never returned beside the error (Art. XIV).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /regions/{id}/map:
    parameters:
      - $ref: '#/components/parameters/RegionId'
    get:
      operationId: getRegionMap
      tags: [Regions]
      summary: Get the region's map projection (COP geometry)
      description: |
        EV1 / FR-1. The deterministic, DOMAIN-shaped map projection for a region — hazard footprints,
        gauges, lifeline infrastructure, exposure, shelters, VERIFIED public reports, a labelled first-order
        prediction cone, and an evac route. All numbers/geometry come from the domain (U3 / Art. XII); the
        client never invents them. PUBLIC-readable. Precise report/PII geometry (`precisePosition`) is
        withheld from PUBLIC and revealed only to RESPONDER+ (server-side gate, Art. XIV / ST3).
      x-required-role: PUBLIC
      responses:
        '200':
          description: |
            Map projection with provenance + freshness (non-empty provenance, U1). Degraded sources
            (cache/mock) still return **200** with `meta.status=degraded` (UW2).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MapProjection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reports:
    get:
      operationId: listReports
      tags: [Reports]
      summary: List the verifier triage queue
      description: |
        FR-6 / T-378. The report queue a VERIFIER/EM triages. **VERIFIER+ only** (Art. XIII: only a
        verifier/EM triages a report). Precise reporter geometry (`geomPrecise`) is withheld from anyone
        below RESPONDER and revealed only to RESPONDER+ (Art. XIV) — the gate is enforced server-side.
        Every response carries non-empty `provenance[]` + `freshness` (F1).
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending]
          description: |
            `pending` returns only UNVERIFIED/TRIAGED rows — the queue view. Any other value
            is rejected with 400. Absent → all statuses.
      responses:
        '200':
          description: The report queue (object with a `reports[]` array) + provenance + freshness.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [reports]
                        properties:
                          reports:
                            type: array
                            items: { $ref: '#/components/schemas/ReportQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: submitReport
      tags: [Reports]
      summary: Submit a consented public SOS report
      description: |
        EV4 / FR-5. Stored as `UNVERIFIED`, AI-triaged (geocode, urgency, deterministic
        confidence blend), surfaced badged "Unverified". Consent is REQUIRED.
        Precise location (`geomPrecise`) is accepted but never returned to non-responders (ST3).
      x-required-role: PUBLIC
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicReportCreate' }
      responses:
        '201':
          description: Report accepted as UNVERIFIED. Public view (generalized location only).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Consent missing or payload failed validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reports/{id}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    patch:
      operationId: transitionReport
      tags: [Reports]
      summary: Transition report state (triage / verify / reject)
      description: |
        EV5 / FR-6 / ST1. VERIFIER or EM transitions the report through its lifecycle
        (UNVERIFIED → TRIAGED → VERIFIED|REJECTED). A terminal decision (VERIFIED/REJECTED)
        on an UNVERIFIED report performs the mandatory TRIAGED hop server-side — both hops
        are written to the audit trail. On transition to **VERIFIED** the system
        MAY emit a CAP Alert; the response is **202 Accepted** and carries the emitted draft
        Alert reference in `meta`. No outbound action is permitted while UNVERIFIED/TRIAGED
        (ST1/UW5). Writes an AUDIT_EVENT.
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportTransition' }
      responses:
        '202':
          description: |
            Transition accepted. On VERIFIED an Alert (DRAFT) is emitted and referenced in
            `meta.emittedAlert`. The response returns the responder view of the report
            (may include precise PII location).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicReportResponderView' }
                      meta:
                        type: object
                        properties:
                          emittedAlert: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Illegal state transition (e.g. VERIFIED → UNVERIFIED, or report already terminal).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseEnvelope' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /routes:
