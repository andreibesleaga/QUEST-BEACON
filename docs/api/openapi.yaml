  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [Alerts]
      summary: Read one page of the hash-chained audit log
      description: |
        RBAC §B.Q6 — "View audit log" is a VERIFIER/EM capability. SERVED
        (`src/adapters/channels/http/routes/audit-events.ts` → `handleAuditEvents`).

        Reads the EXISTING chain — `AlertSink.audit` (`src/adapters/compliance/audit-chain.ts`), the same
        append-only hash chain the CAP emission path and the governance ledger (ADR-034 §5) write to.
        There is no second log and no projection copy.

        **Chain order, oldest first.** Each row's `prevHash` is its predecessor's `hash`, so append order
        (not "newest first") is what lets a client re-link and independently verify the page it received.
        Pagination is `limit`/`offset` for the same reason — a stable, re-linkable window; `nextCursor`
        on `meta.page` is simply the next offset. `data.chainVerified` is the chain's OWN `verify()`,
        recomputed over every row on this read (fail-closed: any broken link makes it `false`).

        **PII-free by construction** (Art. XIV, THREAT §9.3): the chain stores ids, actions, targets,
        instants, an optional evidence digest and cost figures only. This endpoint adds no field and
        resolves no identity. `provenance[]` names the chain itself (`beacon-audit-chain`, mode `LIVE`).

        **Scope, stated honestly:** the chain reachable from the HTTP composition is the alert-sink /
        governance chain. The report-triage audit (`TriageAuditRecord`, written by the report store) is a
        separate record not exposed by this route in v1.

        A fresh process legitimately returns an EMPTY, verified chain — nothing has been audited yet.
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 50, clamped to [1, 500]. A malformed value is a 400.
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          description: Zero-based offset into the chain. A malformed/negative value is a 400.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: |
            One page of the chain with NON-EMPTY `provenance[]` + `freshness` (F1) and a `meta.page`
            pagination block. An offset past the end is an empty page, not an error.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [events, total, chainVerified]
                        properties:
                          events:
                            type: array
                            items: { $ref: '#/components/schemas/AuditEvent' }
                          total:
                            type: integer
                            minimum: 0
                            description: Rows in the WHOLE chain (not in this page).
                          chainVerified:
                            type: boolean
                            description: The chain's own integrity check over every row, recomputed on this read.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stream:
    get:
      operationId: streamDeltas
      tags: [Stream]
      summary: Subscribe to canonical-model delta events (SSE)
      description: |
        EV2 / Q7. Server-Sent Events delta channel keyed by region. The response is a
        `text/event-stream`: each event is a canonical-model delta (incident, exposure,
        report, resource, alert, or heartbeat), debounced per region (`SSE_DEBOUNCE_MS`)
        with a periodic heartbeat (`SSE_HEARTBEAT_SEC`). Clients reconnect with the
        `Last-Event-ID` header to backfill missed deltas. If SSE drops, clients fall back to
        polling (FEATURE_REALTIME). Role PUBLIC (generalized data only; precise PII never
        streamed on the public channel — ST3).
      x-required-role: PUBLIC
      parameters:
        - name: regionId
          in: query
          required: true
          description: Region whose deltas to subscribe to.
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          required: false
          description: Last received event id, for reconnect/backfill.
          schema: { type: string }
      responses:
        '200':
          description: |
            An open SSE stream. Media type `text/event-stream`. Each event payload is a
            JSON `StreamEvent`. The stream stays open; heartbeats keep it alive.
          headers:
            Cache-Control:
              schema: { type: string, example: 'no-cache' }
            Connection:
              schema: { type: string, example: 'keep-alive' }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE frames. Each frame:
                  `id: <eventId>\nevent: <type>\ndata: <StreamEvent JSON>\n\n`.
                  The JSON in each `data:` field conforms to the `StreamEvent` schema.
              examples:
                delta:
                  summary: An exposure delta frame
                  value: |
                    id: 42
                    event: exposure
                    data: {"type":"exposure","regionId":"...","incidentId":"...","at":"2026-06-27T18:00:00Z","payload":{}}

                heartbeat:
                  summary: A heartbeat frame
                  value: |
                    : heartbeat
                    id: 43
                    event: heartbeat
                    data: {"type":"heartbeat","at":"2026-06-27T18:00:20Z"}
            application/json:
              schema:
                description: |
                  Polling-fallback representation (FEATURE_REALTIME=polling): when SSE is
                  unavailable the client polls and receives the same deltas as a JSON array of
                  StreamEvent objects since `Last-Event-ID`.
                type: array
                items: { $ref: '#/components/schemas/StreamEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /channels/telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [Channels]
      summary: Telegram Bot API inbound webhook (ADR-023, ADR-026)
      description: |
        `app/api/v1/channels/telegram/webhook/route.ts` → `handleTelegramWebhook`
        (`src/adapters/channels/messaging/telegram-webhook.ts`). A registered Telegram bot POSTs each
        `Update` here; authenticity is the `X-Telegram-Bot-Api-Secret-Token` header, **constant-time**
        compared to `TELEGRAM_WEBHOOK_SECRET` (`node:crypto timingSafeEqual`) — never an early-out
        string compare. A verified message is self-signed and re-enters the SAME inbound trust
        pipeline every channel uses (allow-list → replay → rate → firewall → parse,
        `src/adapters/channels/messaging/trust.ts`); the inbound allow-list is seeded from the SAME
        `TELEGRAM_ALERT_CHAT_IDS` operator chat-id list the approved-alert broadcast fans out to
        (accepted-risk design decision, see THREAT_MODEL.md TB6 T7.11 and ADR-026 §Consequences).

        **Response shape is intentionally NOT the standard `{data, provenance[], freshness}` envelope**
        (same special-casing as `/health/adapters` and `/stream`) — Telegram only needs an HTTP status
        + a tiny ack/error body. **Posture is non-disclosing**: an unconfigured secret and a bad/absent
        token both look like "route not found" / "unauthorized" with zero config detail leaked.

        **200-always-on-verified semantics**: once the secret-token check passes, EVERY outcome —
        including an unparseable body, a non-message update, or a downstream trust-pipeline rejection
        (unlisted sender, replay, rate-limited, firewalled) — still returns **200 `{ok:true}`**. This is
        deliberate: Telegram retries non-2xx responses, and a malformed/rejected update must never loop.
        Mutually exclusive with `scripts/telegram-poll.ts` (Bot API forbids `getUpdates` while a webhook
        is registered) — `setWebhook` is an explicit operator action, never boot-time.
      x-required-role: PUBLIC
      security:
        - {}
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: false
          description: |
            Telegram's shared inbound secret, set via `setWebhook`'s `secret_token` param. Compared
            constant-time to `TELEGRAM_WEBHOOK_SECRET`. Absent/mismatched ⇒ 401.
          schema: { type: string }
      requestBody:
        required: true
        description: A raw Telegram Bot API `Update` object. Only `message.text`/`message.chat.id` are read; all other fields are ignored.
        content:
          application/json:
            schema:
              type: object
              description: Telegram Bot API `Update` (see core.telegram.org/bots/api#update) — treated as untrusted data, never instructions.
      responses:
        '200':
          description: |
            Ack. Returned both on a successfully-dispatched inbound command AND on any
            verified-but-unusable outcome (unparseable JSON, non-message update, trust-pipeline
            rejection) — Telegram retry semantics (never loop a webhook).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '401':
          description: Missing/incorrect secret token (generic body — no config disclosure).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string, const: UNAUTHORIZED }
                      message: { type: string }
        '404':
          description: |
            `TELEGRAM_WEBHOOK_SECRET` not configured — the route is disabled. Body is the SAME generic
            `NOT_FOUND` shape as any unrouted path (posture non-disclosure, mirrors `/auth/dev-login`).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string, const: NOT_FOUND }
                      message: { type: string }

  /.well-known/sustainability:
    get:
      operationId: getSustainabilityReport
      tags: [Sustainability]
      summary: Get the modeled energy/carbon sustainability report
      description: |
        Optional out-of-core plugin / basic alignment example (non-blocking; not a core acceptance gate). ADR-020 / FR-14. Out-of-band, discoverable, machine-readable sustainability disclosure
        (RFC 8615 well-known URI; RFC `draft-besleaga-green-sustainability-wellknown-05`).

        **Served at the origin ROOT — `https://<host>/.well-known/sustainability` — OUTSIDE the
        `/api/v1` base path** (the `servers` base does not apply to this path). It is intentionally
        out-of-band so it adds **zero** per-request overhead to the crisis hot path (Article XVI).

        Values are **estimated / modeled (demo)**: `measurement-method` is `third-party-modeled` and
        `methodology-uri` resolves to `docs/SUSTAINABILITY.md`. Numbers are deterministic/modeled —
        never LLM-produced (Article XII). Aligns with GHG Protocol scopes, GSF Software Carbon
        Intensity (ISO/IEC 21031:2024), and CSRD/ESRS-E1 optional fields.

        A Basic response is a single `SustainabilityReport` object; an extended trend request
        (`granularity`) returns an ARRAY of them (capped at 366 objects per the draft's DoS guidance).
        Read-only and unauthenticated; gated by `SUSTAINABILITY_ENABLED` (CONFIGURATION §5a).
      x-required-role: PUBLIC
      x-served-at-origin-root: true
      security:
        - {}
      parameters:
        - name: period
          in: query
          required: false
          description: |
            OPTIONAL (extended). Reporting period to report on, RFC 3339 form `YYYY | YYYY-MM |
            YYYY-MM-DD`. Basic level defaults to the most recently completed full calendar month.
          schema: { type: string, pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$' }
        - name: granularity
          in: query
          required: false
          description: |
            OPTIONAL (extended). Slice the `period` into a trend; the response becomes an ARRAY of
            `SustainabilityReport` objects (≤366; draft Array-Size limit).
          schema: { type: string, enum: [daily, monthly, yearly] }
        - name: target
          in: query
          required: false
          description: |
            OPTIONAL (extended). Report on a specific resource path instead of the whole origin;
            echoed back as `target-path` on the object.
          schema: { type: string }
      responses:
        '200':
          description: |
            A modeled, schema-valid sustainability report — a single object (Basic) OR an array of
            them (extended trend). Mirrors `schemas/sustainability-v05.schema.json`.

            **Caching:** the document is heavily cached (ADR-020 / draft Operational Considerations):
            responses carry `Cache-Control: public, max-age=...`, `ETag`, and `Last-Modified`; clients
            SHOULD honor them and avoid frequent re-fetches.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=86400' }
            ETag:
              schema: { type: string }
            Last-Modified:
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SustainabilityReport'
                  - type: array
                    description: |
                      Trend response (extended `granularity`). Capped at 366 objects per the draft's
                      Array-Size Limits security consideration.
                    minItems: 1
                    maxItems: 366
                    items: { $ref: '#/components/schemas/SustainabilityReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Sustainability reporting disabled (`SUSTAINABILITY_ENABLED=off`) — the well-known URI is not served.
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: beacon_session
      description: Session cookie issued at login (AUTH_MODE dev|oauth|oidc).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT signed with AUTH_SECRET. Carries the user's role claim (PUBLIC|RESPONDER|VERIFIER|EM).

  parameters:
    RegionId:
      name: id
      in: path
      required: true
      description: Region id.
      schema: { type: string, format: uuid }
    IncidentId:
      name: id
      in: path
      required: true
      description: Incident id.
      schema: { type: string, format: uuid }
    ReportId:
      name: id
      in: path
      required: true
      description: Public report id.
      schema: { type: string, format: uuid }
    EdxlMessageId:
      name: id
      in: path
      required: true
      description: EDXL-RM message / round-trip id.
      schema: { type: string }
    IncidentStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [ACTIVE, CONTAINED, CLOSED] }
    IncidentTypeFilter:
      name: type
      in: query
      required: false
      schema: { type: string, enum: [WILDFIRE, FLOOD] }

  responses:
    BadRequest:
      description: Malformed request (400).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelope'
              - type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid authentication (401).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but role lacks the capability per RBAC matrix (403).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Semantically invalid (e.g. consent missing, schema/citation validation failed) (422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: |
        Genuine total outage with NO fallback rung (503): the source is down AND there is no
        last-known-good cache and no recorded mock to serve. This is the ONLY case a data GET
        returns 5xx — a degraded source that still has cache/mock returns **200** with
        `meta.status=degraded` instead (UW2 / OP3 — never a dead-end). `Retry-After` indicates
        when to retry. The body MAY carry an `errors[]` entry (`UPSTREAM_UNAVAILABLE`) and
        `meta.status=unavailable`.
      headers:
        Retry-After:
          schema: { type: integer, example: 30 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  meta:
                    type: object
                    properties:
                      status:
                        type: string
                        const: unavailable

  schemas:
    # ---------------------------------------------------------------------------
    # Universal response envelope + provenance/citation primitives
    # ---------------------------------------------------------------------------

    ResponseEnvelope:
      type: object
      description: |
        Universal BEACON response envelope. `provenance[]` and `freshness` are MANDATORY on
        every data response (U1). `data` shape is specialized per endpoint via allOf.
      required: [data, provenance, freshness]
      properties:
        data:
          description: Endpoint-specific payload (object or array).
        provenance:
          type: array
          description: One SourceRef per contributing SOURCE_RECORD.
          items: { $ref: '#/components/schemas/SourceRef' }
        freshness:
          type: string
          format: date-time
          description: Timestamp of the freshest contributing datum (ISO-8601).
        meta:
          type: object
          additionalProperties: true
          description: |
            Optional pagination / degradation / engine metadata. `status` reports the
            degradation state of this response (UW2): `ok` (live), `degraded` (served from a
            fallback rung — cache/mock — still a 200), `unavailable` (no data available). When
            degraded, `degraded=true` and the served `mode` (CACHED|MOCK) is reported; the
            `provenance[]` + `freshness` describe the cache/mock actually served. `DB` is a served
            mode but never a degradation: an operator-maintained row is not a fallback rung.
          properties:
            status:
              type: string
              enum: [ok, degraded, unavailable]
              description: Degradation state of this response (200-degraded primary path, UW2).
            degraded:
              type: boolean
              description: True when any layer was served from a fallback rung (cache/mock).
            mode:
              type: string
              enum: [LIVE, CACHED, MOCK, DB]
              description: Effective served mode when degraded.
            page:
              type: object
              description: Cursor pagination block (collection endpoints).
              properties:
                nextCursor: { type: [string, 'null'] }
                hasMore: { type: boolean }
                limit: { type: integer }
        errors:
          type: array
          description: |
            Non-fatal warnings accompanying a successful response — e.g. a `SOURCE_DEGRADED`
            informational entry inside a 200 when a layer fell back to cache/mock.
          items: { $ref: '#/components/schemas/Error' }

    SitrepEnvelope:
      description: |
        SitRep response envelope. Extends the universal envelope with the MANDATORY
        `citations[]` (U2) — one Citation per grounded SitRep field.
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          required: [data, citations]
          properties:
            data: { $ref: '#/components/schemas/Sitrep' }
            citations:
              type: array
              items: { $ref: '#/components/schemas/Citation' }

    ErrorEnvelope:
      type: object
      description: Envelope for error responses (no data payload).
      required: [errors]
      properties:
        errors:
          type: array
          items: { $ref: '#/components/schemas/Error' }
        provenance:
          type: array
          items: { $ref: '#/components/schemas/SourceRef' }
        freshness:
          type: [string, 'null']
          format: date-time
        meta:
          type: object
          additionalProperties: true

    # ---------------------------------------------------------------------------
    # Map projection (GET /regions/{id}/map) — DOMAIN-shaped COP geometry
    # ---------------------------------------------------------------------------

    ProjectedFeature:
      type: object
      description: |
        A geolocated projected feature. `precisePosition` is present ONLY for RESPONDER+ (Art. XIV);
        PUBLIC callers receive the generalized `position` only.
      required: [id, position]
      properties:
        id: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        precisePosition:
          allOf: [{ $ref: '#/components/schemas/Position' }]
          description: Precise (PII) location — RESPONDER+ only; omitted for PUBLIC (Art. XIV).

    ProjectedHazard:
      type: object
      description: A hazard footprint carried through unchanged (routed to fire/flood by kind).
      required: [id, kind, geometry, observedAt]
      properties:
        id: { type: string }
        kind: { type: string, description: 'Hazard kind, e.g. PERIMETER, HOTSPOT, FLOOD_REACH.' }
        geometry: { $ref: '#/components/schemas/Geometry' }
        observedAt: { type: string, format: date-time }
        intensity: { type: number, description: 'Optional intensity (e.g. FRP for a hotspot).' }

    ProjectedGauge:
      description: A flood gauge, projected.
      allOf:
        - $ref: '#/components/schemas/ProjectedFeature'
        - type: object
          required: [floodCategory]
          properties:
            floodCategory: { type: string }
            stage: { type: number }

    ProjectedInfra:
      description: A lifeline infrastructure node, projected.
      allOf:
        - $ref: '#/components/schemas/ProjectedFeature'
        - type: object
          required: [kind, status]
          properties:
            kind: { type: string }
            status: { type: string }

    ProjectedExposure:
      description: An asset/person inside hazard geometry (deterministic exposure), projected.
      allOf:
        - $ref: '#/components/schemas/ProjectedFeature'
        - type: object
          required: [reason, insideHazard]
          properties:
            reason: { type: string }
            insideHazard: { type: boolean }

    ProjectedShelter:
      description: A shelter with capacity/demand, projected.
      allOf:
        - $ref: '#/components/schemas/ProjectedFeature'
        - type: object
          required: [capacity, demand, status]
          properties:
            capacity: { type: integer }
            demand: { type: integer }
            status: { type: string }

    ProjectedReport:
      description: |
        A VERIFIED public report, projected. `position` is the generalized (coarsened) location; the
        precise location rides `precisePosition` only for RESPONDER+ (Art. XIV / ST3).
      allOf:
        - $ref: '#/components/schemas/ProjectedFeature'
        - type: object
          required: [status]
          properties:
            status: { type: string }
            confidence: { type: number, description: 'Numeric confidence blend (0..1).' }

    ProjectedPrediction:
      type: object
      description: |
        A labelled first-order prediction (Art. XII) — carries method, inputs and uncertainty; no
        physics-grade claim.
      required: [id, geometry, method, inputs, uncertainty]
      properties:
        id: { type: string }
        geometry: { $ref: '#/components/schemas/Geometry' }
        method: { type: string }
        inputs: { type: string, description: 'Deterministically stringified inputs (labelled).' }
        uncertainty: { type: string, description: 'Human-readable uncertainty, e.g. "±40%".' }

    ProjectedRoute:
      type: object
      description: An evacuation route path with a hazard-avoidance flag.
      required: [id, path, avoidsHazard]
      properties:
        id: { type: string }
        path:
          type: array
          items: { $ref: '#/components/schemas/Position' }
        avoidsHazard: { type: boolean }

    ProjectedCamera:
      type: object
      description: |
        A location-pinned LIVE camera surfaced on the COP as a link-out pin (E11 "Live Views", ADR-027).
        `viewUrl` is the provider's own external live-view PAGE (always `https:`, host-validated — the
        href-injection guard); BEACON never embeds/proxies/rehosts the video (link-only, Art. XII). The
        engine and the LLM never read a pixel from it. `isLive:false` ⇒ a periodic snapshot, labelled
        honestly. The `cameras` layer is default-OFF (opt-in, `FEATURE_CAMERAS`) and map-only (not in
        `/status`).
      required: [id, position, kind, title, provider, viewUrl, isLive]
      properties:
        id: { type: string }
        position: { $ref: '#/components/schemas/Position' }
        kind:
          type: string
          enum: [FIRE_CAMERA, TRAFFIC_CCTV, WEBCAM, CITIZEN_STREAM]
          description: |
            FIRE_CAMERA (ALERTWildfire/ALERTCalifornia), TRAFFIC_CCTV (Caltrans/511/CNADNR), WEBCAM
            (Windy), or CITIZEN_STREAM (consent-gated "Unofficial" — ADR-029, never merged with agency
            pins).
        title: { type: string, description: 'Human-facing camera name.' }
        provider:
          type: string
          description: 'Attribution source, e.g. "ALERTCalifornia | UC San Diego", "Caltrans", "windy.com".'
        viewUrl:
          type: string
          format: uri
          description: 'External live-view page (always https, host-validated) — opened in a new tab, never embedded.'
        isLive:
          type: boolean
          description: 'true = live stream; false = periodic snapshot (labelled honestly).'

    MapProjection:
      type: object
      description: |
        The full DOMAIN-shaped map projection for one region (GET /regions/{id}/map). Each slice may be
        empty (an absent layer is `[]`); `route`/`cameras` are optional. All geometry/numbers
        are domain-built (U3 / Art. XII) — never client-invented. Precise report geometry is RESPONDER-gated.
        The optional `cameras` slice (E11 "Live Views", ADR-027) carries link-out camera pins; per-layer
        provenance/freshness for it (and every other layer) rides `layerSources` in the response envelope's
        `meta` (the `LayerId → sourceId`/`fetchedAt`/`mode` map), not this domain projection — cameras are
        a map-only overlay, not part of `/status`.
      required:
        [
          regionId,
          incidentType,
          hazards,
          gauges,
          infrastructure,
          exposure,
          shelters,
          reports,
          predictions,
        ]
      properties:
        regionId: { type: string }
        incidentType: { type: string, description: 'e.g. WILDFIRE, FLOOD.' }
        hazards:
          type: array
          items: { $ref: '#/components/schemas/ProjectedHazard' }
        gauges:
          type: array
          items: { $ref: '#/components/schemas/ProjectedGauge' }
        infrastructure:
          type: array
          items: { $ref: '#/components/schemas/ProjectedInfra' }
        exposure:
          type: array
          items: { $ref: '#/components/schemas/ProjectedExposure' }
        shelters:
          type: array
          items: { $ref: '#/components/schemas/ProjectedShelter' }
        reports:
          type: array
          items: { $ref: '#/components/schemas/ProjectedReport' }
        cameras:
          type: array
          description: 'Optional link-out camera pins (E11 "Live Views", ADR-027). Absent/[] when FEATURE_CAMERAS is off or no cameras cover the region.'
          items: { $ref: '#/components/schemas/ProjectedCamera' }
        predictions:
          type: array
          description: |
            Every map-plottable prediction for the region, in derivation order (ADR-033 §3.1). `[]` when the
            region has none. Each entry carries its OWN method, inputs and uncertainty, so N predictions are
            N separately-labelled cones — never one merged geometry with an averaged caveat (Art. XII).
          items: { $ref: '#/components/schemas/ProjectedPrediction' }
        prediction:
          allOf: [{ $ref: '#/components/schemas/ProjectedPrediction' }]
          deprecated: true
          description: |
            DEPRECATED — use `predictions`. An additive-compatibility mirror of `predictions[0]`, kept so a
            v1 client that never learned the plural field keeps rendering the first cone exactly as before.
            Absent when `predictions` is empty (identical to the pre-plural behaviour).
        route: { $ref: '#/components/schemas/ProjectedRoute' }

    Error:
      type: object
      description: A single structured error or warning.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine code, e.g. CONSENT_REQUIRED, FORBIDDEN_ROLE, SOURCE_DEGRADED.
        message: { type: string }
        field:
          type: string
          description: JSON pointer / field path the error applies to.
        detail:
          type: object
          additionalProperties: true

    SourceRef:
      type: object
      description: |
        Provenance reference → SOURCE_RECORD (U1). Carries enough to attribute and assess
        freshness/licensing of the datum without a second fetch.
      required: [sourceId, source, adapter, fetchedAt, license, mode]
      properties:
        sourceId:
          type: string
          format: uuid
          description: Id of the SourceRecord this reference resolves to.
        source:
          type: string
          description: Logical source name, e.g. FIRMS, NWS, NWPS, OVERPASS.
        adapter:
          type: string
          description: Adapter id that fetched/normalized the datum.
        fetchedAt:
          type: string
          format: date-time
        license:
          type: string
          description: License/terms string for the datum.
        mode:
          type: string
          enum: [LIVE, CACHED, MOCK, DB]
          description: |
            SERVED provenance — where this datum actually came from (ADR-041 §3). `LIVE` upstream,
            `CACHED` last-known-good copy of an upstream response, `MOCK` recorded fixture, and `DB`
            an operator-maintained record held in BEACON's own store. A `DB` entry's `fetchedAt` is
            that row's LAST EDIT and asserts nothing about upstream freshness. This is NOT the adapter
            ladder rung (`AdapterHealth.mode`), which stays three-valued: no adapter fetches `DB`.

    Citation:
      type: object
      description: Grounds a single SitRep field to a source (U2). → CITATION entity.
      required: [field, sourceId, claim]
      properties:
        field:
          type: string
          description: Which SitRep field this citation grounds (e.g. summary, priorities[0]).
        sourceId:
          type: string
          format: uuid
          description: SourceRecord id the claim is grounded in.
        claim:
          type: string
          description: The specific factual claim attributed to the source.

    # ---------------------------------------------------------------------------
    # GeoJSON geometry (RFC 7946) — used by all geo-bearing entities
    # ---------------------------------------------------------------------------

    Position:
      type: array
      description: GeoJSON position [lon, lat] or [lon, lat, elevation].
      minItems: 2
      maxItems: 3
      items: { type: number }

    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates: { $ref: '#/components/schemas/Position' }

    LineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Position' }

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items: { $ref: '#/components/schemas/Position' }

    MultiPolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: MultiPolygon }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              minItems: 4
              items: { $ref: '#/components/schemas/Position' }

    Geometry:
      description: Any supported GeoJSON geometry.
      oneOf:
        - $ref: '#/components/schemas/PointGeometry'
        - $ref: '#/components/schemas/LineStringGeometry'
        - $ref: '#/components/schemas/PolygonGeometry'
        - $ref: '#/components/schemas/MultiPolygonGeometry'

    BBox:
      type: array
      description: GeoJSON bounding box [west, south, east, north].
      minItems: 4
      maxItems: 4
      items: { type: number }

    # ---------------------------------------------------------------------------
    # Canonical domain entities (DOMAIN_MODEL §1–§2)
    # ---------------------------------------------------------------------------

    Region:
      type: object
      description: |
        One configured region, as `GET /regions` serves it (the `RegionView` projection in
        `src/application/interaction/command-router.ts`). `id` + `name` are always present. The
        geography/locale fields are served EXACTLY as the wired read-model projects them and are
        OMITTED — never defaulted, never borrowed from another region (finding F-06) — when it does not
        carry them: the default config-backed registry supplies all four for every shipped zone, while
        the `FEATURE_STORE=postgres` projection serves only `id` and `name`, because the `region` table
        has no `iso`/`tz`/`languages` column.

        The region's operational posture (`enabled_adapters`, `source_mode_overrides`) is deliberately
        NOT part of this schema: it is server-side configuration, and no endpoint exposes it. Per-source
        LIVE/CACHED/MOCK modes are observable through `GET /sources`.
      required: [id, name]
      properties:
        id:
          type: string
          description: |
            Registry id from `config/regions.json` (e.g. `us-ca`, `ro`) — a slug, NOT a uuid. This is
            the id every other region-scoped route and the `regionId` query parameter take.
          example: us-ca
        name:
          type: string
          description: |
            Operator-facing English label. It is NOT a localized display string: UI labels come from
            the message catalog (`shell.region.<id>`, ADR-030), and machine values are never
            translated (FR-I18N-6).
          example: California (US)
        iso:
          type: string
          description: ISO-3166-1 alpha-2 of the containing country — decides country-scoped source coverage.
          example: US
        tz:
          type: string
          description: IANA timezone in which this region's timestamps are displayed (FU-8).
          example: America/Los_Angeles
        languages:
          type: array
          description: BCP-47 tags, most significant first. Outbound alerts carry these AND English (FR-I18N-6).
          items: { type: string }
          example: [en]
        bbox: { $ref: '#/components/schemas/BBox' }

    Incident:
      type: object
      required: [id, regionId, type, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        type:
          type: string
          enum: [WILDFIRE, FLOOD]
        status:
          type: string
          enum: [ACTIVE, CONTAINED, CLOSED]
        updatedAt: { type: string, format: date-time }

    IncidentDetail:
      type: object
      description: |
        One incident as the core projects it (`IncidentView`, src/application/interaction/
        command-router.ts) — the element `GET /regions/{id}/incidents` lists AND the payload
        `GET /incidents/{id}` serves. ONE declaration, deliberately: a separate "detail" shape would be
        a second contract free to drift from the collection it details.

        `facts[]` and `priorities[]` are DETERMINISTIC engine output (Art. XII — never LLM-produced).
        Hazard geometry and gauges are NOT inlined here: map-plottable geometry is served by
        `GET /regions/{id}/map`, and duplicating it onto this record would be a second copy of the COP.
      required: [id, regionId, type, status, headline, facts, priorities, provenance]
      properties:
        id: { type: string }
        regionId: { type: string }
        type:
          type: string
          description: 'e.g. WILDFIRE | FLOOD'
        status:
          type: string
          description: 'e.g. ACTIVE | CONTAINED | CLOSED'
        headline: { type: string }
        facts:
          type: array
          description: Deterministic grounded facts, each citing its SOURCE_RECORD (F2).
          items:
            type: object
            additionalProperties: true
        priorities:
          type: array
          description: Engine-ranked attention areas (FR-13, SPEC §5.2).
          items:
            type: object
            additionalProperties: true
        predictions:
          type: array
          description: Labeled first-order projections, in derivation order. Omitted when none projected.
          items: { $ref: '#/components/schemas/Prediction' }
        trend:
          type: object
          description: Escalation trend, when the derivation produced one.
          additionalProperties: true
        news:
          type: array
          description: Region-scoped news/social batch used for the deterministic grounding pass.
          items:
            type: object
            additionalProperties: true
        provenance:
          type: array
          description: The incident's own SourceRefs (also aggregated onto the envelope's provenance[]).
          items: { $ref: '#/components/schemas/SourceRef' }
        freshness: { type: string, format: date-time }

    ProjectedExposureRow:
      type: object
      description: |
        One exposure row as the COP projection emits it (`ProjectedExposure`) — the wire shape shared by
        `GET /regions/{id}/map` `data.exposure[]` and `GET /incidents/{id}/exposure`. Anonymous by
        construction: it names an infrastructure NODE and its relationship to the hazard, never a person.
      required: [id, position, reason, insideHazard]
      properties:
        id: { type: string, description: 'The exposed InfrastructureNode id.' }
        position:
          type: array
          description: '[lon, lat] — GeoJSON axis order.'
          items: { type: number }
          minItems: 2
          maxItems: 2
        reason:
          type: string
          enum: [IN_POLYGON, IN_BUFFER, OUTAGE]
        insideHazard: { type: boolean }

    IncidentExposure:
      type: object
      description: |
        The `GET /incidents/{id}/exposure` payload. `exposure[]` is byte-identical to the region map's
        exposure slice (one computation, two doors); `regionId` states WHICH region's derivation answered.
      required: [incidentId, regionId, exposure, count]
      properties:
        incidentId: { type: string }
        regionId: { type: string }
        exposure:
          type: array
          items: { $ref: '#/components/schemas/ProjectedExposureRow' }
        count: { type: integer, minimum: 0 }

    IncidentSummary:
      description: |
        FR-D6-4 incident-close export document (ADR-035 §4; `GET /incidents/{id}/summary`). Mirrors
        `schemas/d6-incident-summary.schema.json` exactly — every field is a COUNT, an AREA, an INSTANT
        or a PROVENANCE row; there is no per-person row anywhere (Art. XIV aggregate-only, enforced at
        this export boundary by a fail-closed runtime key walk, ADR-035 §4 Layer D).
      type: object
      required:
        [incidentId, generatedAt, alertsIssued, tasksCompleted, provenance, freshness, caveats]
      properties:
        incidentId:
          { type: string, description: 'The incident this summary closes out — an entity id.' }
        regionId: { type: string, description: 'Region registry id — a place, not a person.' }
        generatedAt:
          {
            type: string,
            format: date-time,
            description: 'Server-injected clock instant (Art. XII) — never client-set.',
          }
        closedAt: { type: string, format: date-time }
        alertsIssued: { type: integer, minimum: 0 }
        tasksCompleted: { type: integer, minimum: 0 }
        tasksTotal: { type: integer, minimum: 0 }
        sheltersOpen: { type: integer, minimum: 0 }
        shelterOccupancyPeak: { type: integer, minimum: 0 }
        shelterCapacityTotal: { type: integer, minimum: 0 }
        affectedAreaKm2: { type: number, minimum: 0 }
        casualtyTally: { $ref: '#/components/schemas/IncidentSummaryCasualtyTally' }
        provenance:
          type: array
          items: { $ref: '#/components/schemas/IncidentSummaryProvenance' }
        freshness:
          type: object
          required: [fetchedAt]
          description: The OLDEST fetchedAt across provenance — the document is only as fresh as its stalest input.
          properties:
            fetchedAt: { type: string, format: date-time }
        caveats:
          type: array
          items: { type: string }
          description: |
            Limitation strings derived from the document's own content (Art. XVI); ALWAYS includes the
            aggregate-only statement, regardless of input.

    IncidentSummaryCasualtyTally:
      description: FR-D6-5 aggregate casualty tally — a COUNT, never a per-person record.
      type: object
      required: [count, label, authoritative]
      properties:
        reportId:
          {
            type: string,
            description: 'Id of the damage report this tally summarises — an entity id, never a reporter.',
          }
        count: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
        label: { type: string, enum: ['unverified — not authoritative'] }
        authoritative: { type: boolean, enum: [false] }

    IncidentSummaryProvenance:
      description: One provenance row — `SourceRecord` at the export boundary, `id` carried as `sourceId`.
      type: object
      required: [sourceId, source, adapter, fetchedAt, license, mode]
      properties:
        sourceId: { type: string }
        source: { type: string }
        adapter: { type: string }
        fetchedAt: { type: string, format: date-time }
        license: { type: string }
        mode:
          type: string
          enum: [LIVE, CACHED, MOCK, DB]

    HazardGeometry:
      type: object
      description: |
        CANONICAL DOMAIN entity, documented for reference — **no v1 path emits this shape verbatim**.
        Hazard footprints reach a client through `GET /regions/{id}/map` `data.hazards[]`, which is the
        anonymous PROJECTED wire shape (id, kind, geometry, observedAt, intensity?) with the raw source
        id stripped. Stated here rather than left as a silent unused definition.
      required: [id, incidentId, kind, geom, observedAt, sourceId]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        kind:
          type: string
          enum: [HOTSPOT, PERIMETER, FLOOD_REACH, SPREAD_CONE]
        geom: { $ref: '#/components/schemas/Geometry' }
        intensity:
          type: number
          description: Deterministic intensity value (never LLM-produced).
        observedAt: { type: string, format: date-time }
        sourceId:
          type: string
          format: uuid
          description: SourceRecord provenance.

    Gauge:
      type: object
      description: |
        CANONICAL DOMAIN entity, documented for reference — **no v1 path emits this shape verbatim**.
        Gauges reach a client through `GET /regions/{id}/map` `data.gauges[]` (projected: id, position,
        floodCategory, stage?).
      required: [id, geom, stage, floodCategory, sourceId]
      properties:
        id: { type: string, format: uuid }
        geom: { $ref: '#/components/schemas/PointGeometry' }
        stage: { type: number }
        floodCategory:
          type: string
          enum: [NONE, ACTION, MINOR, MODERATE, MAJOR]
        crestForecast:
          type: [number, 'null']
        crestTime:
          type: [string, 'null']
          format: date-time
        sourceId: { type: string, format: uuid }

    InfrastructureNode:
      type: object
      required: [id, type, geom, status, sourceId]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [HOSPITAL, NURSING_HOME, POWER, CELL, ROAD, RAIL, SHELTER]
        geom: { $ref: '#/components/schemas/Geometry' }
        status:
          type: string
          enum: [ONLINE, AT_RISK, OFFLINE]
        sourceId: { type: string, format: uuid }

    Exposure:
      type: object
      description: |
        CANONICAL DOMAIN exposure row (U3) — node relationship to a hazard. Documented for reference:
        **no v1 path emits this shape verbatim.** The wire shape both exposure surfaces
        (`GET /regions/{id}/map` `data.exposure[]` and `GET /incidents/{id}/exposure`) actually serve is
        `ProjectedExposureRow`, which carries no `distanceM`/`computedAt` because the projection does not
        emit them. Kept so the fuller domain record stays legible beside the projected one.
      required: [id, incidentId, nodeId, insideHazard, reason, computedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        node:
          $ref: '#/components/schemas/InfrastructureNode'
        insideHazard: { type: boolean }
        distanceM:
          type: number
          description: Deterministic distance in metres (Turf/SQL).
        reason:
          type: string
          enum: [IN_POLYGON, IN_BUFFER, OUTAGE]
        computedAt: { type: string, format: date-time }

    Prediction:
      type: object
      description: Labeled first-order projection with method, inputs and uncertainty.
      required: [id, incidentId, kind, method]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        kind:
          type: string
          enum: [FIRE_CONE, FLOOD_INUNDATION, IMPACT_OVER_TIME, ESCALATION]
        geom: { $ref: '#/components/schemas/Geometry' }
        method:
          type: string
          description: Labeled first-order method description.
        inputs:
          type: object
          additionalProperties: true
        uncertainty:
          type: number
          description: Deterministic uncertainty measure.
        horizon: { type: string, format: date-time }
        sourceId:
          type: [string, 'null']
          format: uuid
          description: |
            SourceRecord provenance for the inputs this projection was derived from
            (DDL `prediction.source_id`). Predictions are derived but still anchor to the
            triggering source(s) for traceability.

    PublicReport:
      type: object
      description: |
        Public view of a consented SOS report. Precise location/contact (PII) is NEVER
        present here — only generalized location (ST3 / Art. XIV).
      required: [id, source, status, consent]
      properties:
        id: { type: string, format: uuid }
        incidentId:
          type: [string, 'null']
          format: uuid
        source:
          type: string
          enum: [WEB, SMS, SOCIAL]
        status:
          type: string
          enum: [UNVERIFIED, TRIAGED, VERIFIED, REJECTED]
        text:
          type: string
          maxLength: 2000
          description: |
            The reporter's own words — the CLAIM a verifier approves or rejects (Art. XIII). Served on
            GET /reports, which is VERIFIER+ only; that endpoint gate is the audience control, so the
            field is not separately role-gated. Purged with its row at purgeAfter (Art. XIV). Absent for
            rows written before migration 0006.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Deterministic weighted blend (Q4). Surfaced with its components.
        confidenceComponents:
          type: object
          description: geocode | authority | classifier | corroboration sub-scores.
          properties:
            geocode: { type: number }
            authority: { type: number }
            classifier: { type: number }
            corroboration: { type: number }
        geomGeneralized:
          $ref: '#/components/schemas/Geometry'
        consent: { type: boolean }
        createdAt: { type: string, format: date-time }

    PublicReportResponderView:
      description: |
        Responder-authenticated view — includes precise PII location and contact
        (RESPONDER/VERIFIER/EM only — ST3 / Art. XIV). Never returned to PUBLIC.
      allOf:
        - $ref: '#/components/schemas/PublicReport'
        - type: object
          properties:
            geomPrecise:
              allOf:
                - $ref: '#/components/schemas/PointGeometry'
              description: RESPONDER-ONLY precise location (PII). Never exposed to PUBLIC.
            contact:
              type: string
              description: RESPONDER-ONLY reporter contact (PII). Purged after incident lifecycle.
            purgeAfter:
              type: string
              format: date-time
              description: PII purge deadline (incident lifecycle; no PII retention).

    # CORRECTED 2026-08-01 (finding F-405) — this schema described a body the server has never parsed.
    # It required `source`, `geomPrecise` and `description`; `reportCommand` (src/adapters/channels/http/
    # routing.ts) reads `text`, `consent`, top-level `lat`/`lng`, `incidentId` and `liveViewUrl`, and
    # `source` is fixed to WEB server-side (command-router.ts handleReport). Three vocabularies were in play
    # at once — this document, the client, and the parser — which is how F-360 shipped: the client mirrored
    # neither, sent a nested `location`, and was answered 201 Created with the coordinate discarded.
    # THE CODE IS THE GROUND TRUTH HERE. This schema now matches `SubmitReportWireBody`, the single
    # declaration the parser itself is keyed by; the client type is derived from that same declaration.
    PublicReportCreate:
      type: object
      required: [consent, text]
      properties:
        consent:
          type: boolean
          description: Must be true; enforced at 422 CONSENT_REQUIRED if absent or false (EV4/UW6).
        text:
          type: string
          description: Free-text situation description (AI-classified, never auto-trusted).
        lat:
          type: number
          description: |
            Reporter precise latitude (PII) — stored responder-only, generalized for public (Art. XIV).
            Sent as a TOP-LEVEL pair with `lng`, not as a nested object or a GeoJSON geometry. Both must be
            present for a location to be recorded; either alone is ignored.
        lng:
          type: number
          description: Reporter precise longitude (PII). Note the spelling — `lng`, not `lon`.
        incidentId:
          type: string
          description: |
            Optional incident this SOS belongs to (`public_report.incident_id`, a nullable FK). When present,
            a later `VERIFIED` + `emitCap` transition can scope its DRAFT CAP alert to THIS incident; an
            unlinked report drafts nothing and says so (F-362). Absent means "not linked", never a guess.
        liveViewUrl:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Optional consent-gated citizen live-view link (E11 "Live Views" v1.2, ADR-029) — **gated by
            `FEATURE_CITIZEN_STREAM` (default OFF)**. When present it becomes a distinct `CITIZEN_STREAM`
            camera, permanently badged "Live Feed — Unofficial", HITL-reviewed, 2 h TTL, **never fetched
            server-side**. STRICT https host allow-list: `youtube.com`/`www.youtube.com` (path
            `/watch` or `/live`), `youtu.be`, `twitch.tv`, `facebook.com`/`www.facebook.com` (non-root
            path); no http/IP-literal/userinfo/private host (SSRF guard). **Posture when the feature is
            OFF: the field is REJECTED with a 400** (honest — not silently dropped). A disallowed value is
            likewise a 400.

    # CORRECTED 2026-08-01 (finding F-405). The transition field is `decision`, not `toStatus` —
    # `verifyCommand` (routing.ts) has always read `decision`, so a caller following this document was
    # answered 400 on every request. `reason` is documented but read by nothing and is marked accordingly
    # rather than quietly deleted (the honest-limitations rule). `emitCap` is now genuinely implemented
    # (F-362) after being documented here since S03 and read by no code at all.
    ReportTransition:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [TRIAGED, VERIFIED, REJECTED]
          description: |
            The human triage decision. Legal hops are enforced by the domain: `UNVERIFIED → TRIAGED →
            VERIFIED|REJECTED`. `UNVERIFIED → VERIFIED` is REFUSED (409) — a report is triaged before it
            is verified, and that ordering is the Art. XIII gate, not a formality.
        emitCap:
          type: boolean
          default: false
          description: |
            On `VERIFIED`, draft a CAP alert for the report's linked incident and return it in
            `meta.emittedAlert` (202). Must be a boolean — a string is rejected 400 rather than coerced,
            because a truthy `"false"` deciding whether a public alert is drafted is precisely what
            Art. XIII exists to prevent.

            **DRAFT ONLY.** Promotion to ACTUAL remains a separate authenticated approval that records the
            approver (`POST /alerts/{id}/approve`); `AlertSinkPort.emit` accepts only an approved ACTUAL
            alert *at the type level*, so this path cannot reach a public sink however it is called.
            Ignored on `TRIAGED`/`REJECTED` — no outbound action from a report that was never verified.
            A report with no `incidentId` drafts nothing and returns `meta.capNotEmitted` explaining why.
        reason:
          type: string
          description: |
            **NOT READ (v1).** Documented since S03 but no parser consumes it — a REJECTED report records
            no free-text reason today. Listed here rather than removed so the gap is visible; sending it is
            harmless (unknown fields are ignored) but has no effect.
        visionAssist:
          type: object
          description: |
            Optional advisory vision-assist attached to the decision (E6·T-290/T-291). Consent + PII-screen
            gated at the compliance gateway. ADVISORY ONLY — it runs after the decision is committed and can
            never block or alter it (Art. XII/XIII/XIV); any finding is surfaced in `meta.visionFinding`.

    Sitrep:
      type: object
      description: |
        Generated situational report. All numbers/rankings/trend are deterministic (U3);
        each field is grounded by a Citation in the SitrepEnvelope.citations[] (U2).
      required: [id, incidentId, generatedAt, summary, priorities, outlook, trend, aiMode]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        summary:
          type: string
          description: Narrative synthesis of cited facts (LLM narration only).
        priorities:
          type: array
          description: Deterministically ranked attention areas (not LLM-ranked).
          items:
            type: object
            required: [rank, label]
            properties:
              rank: { type: integer }
              label: { type: string }
              detail: { type: string }
        outlook:
          type: array
          description: |
            FEV-8 / ADR-033 §5. Every prediction of the incident, ranked by the ENGINE
            (likelihood class DESC, then soonest ETA ASC, then severity DESC) — not LLM-ranked,
            and never re-sorted by a client. `[]` when the incident has no prediction.
            This is the surface that carries geometry-less kinds (ESCALATION, IMPACT_OVER_TIME):
            `MapProjection.predictions[]` requires a geometry and therefore omits them (finding F-77).
            Every row carries the method + uncertainty a labeled first-order projection must travel
            with; `likelihoodClass`/`etaHours` are absent whenever no SOURCE signal supported one
            (FUW-3 — never an invented probability or lead time).
          items:
            type: object
            required: [rank, predictionId, kind, method, uncertainty]
            properties:
              rank:
                type: integer
                description: 1-based engine-assigned position (deterministic; ties keep derivation order).
              predictionId: { type: string }
              kind:
                type: string
                enum: [FIRE_CONE, FLOOD_INUNDATION, IMPACT_OVER_TIME, ESCALATION]
              method:
                type: string
                description: The labeled first-order method, verbatim from the prediction.
              uncertainty:
                type: number
                minimum: 0
                maximum: 1
              likelihoodClass:
                type: string
                enum: [POSSIBLE, LIKELY, VERY_LIKELY]
                description: Present only when a source-provided probability signal supported one (FU-11).
              etaHours:
                type: number
                minimum: 0
                description: Source-supported lead time in hours, unrounded.
              hazardArrival:
                type: string
                format: date-time
                description: generatedAt + etaHours, computed server-side from the report's own instant (FU-12).
        trend:
          type: string
          enum: [ESCALATING, STEADY, DEESCALATING]
        aiMode:
          type: string
          enum: [cloud, local, deterministic-only]
          description: Which rung of the AI ladder produced this SitRep (UW1).

    ReportQueueItem:
      type: object
      description: |
        One row of the verifier triage queue (GET /reports). `geomPrecise` is present ONLY for
        RESPONDER+ responses (Art. XIV) — withheld from lower roles even though the queue itself is
        VERIFIER+. `confidence` is the deterministic blend (Art. XII), never LLM-produced.
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [UNVERIFIED, TRIAGED, VERIFIED, REJECTED]
        confidence: { type: number, minimum: 0, maximum: 1 }
        geomPrecise:
          description: Precise SOS geometry (GeoJSON) — RESPONDER+ only (Art. XIV).
          $ref: '#/components/schemas/Geometry'

    AlertQueueItem:
      type: object
      description: |
        One row of the DRAFT alert review queue (GET /alerts). Always `state=DRAFT` — a threshold fire
        never produces an ACTUAL alert (Art. XIII); promotion is the separate HITL approve gate.
      required: [id, state, category, severity, incidentId]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [DRAFT]
        category:
          type: string
          enum: [Fire, Met, Safety]
        severity:
          type: string
          enum: [MINOR, MODERATE, SEVERE, EXTREME]
        incidentId: { type: string }
        forecast:
          allOf: [{ $ref: '#/components/schemas/ForecastEvidence' }]
          description: |
            Present ONLY for an anticipatory DRAFT (a `FORECAST_GAUGE_CATEGORY` fire). Absent — not null —
            for an observed-rule DRAFT: an unavailable figure is labelled unavailable, never invented.

    ForecastEvidence:
      type: object
      description: |
        The evidence an ANTICIPATORY DRAFT rests on (WP A8, ADR-033 §6 / FEV-9). Every value is
        source-supported or a pure function of one; `method` and `uncertainty` are the labels the
        predictions law requires beside any served figure — BEACON models no hazard travel time and
        publishes no confidence interval for these numbers.
      required:
        [leadTimeHours, expectedCrossingAt, forecastCategory, forecastIssuedAt, method, uncertainty]
      properties:
        leadTimeHours:
          type: number
          description: Remaining lead time in hours, exactly as the SOURCE stated it.
        expectedCrossingAt:
          type: string
          format: date-time
          description: Evaluation instant + `leadTimeHours`. Not a modelled arrival time.
        forecastCategory:
          type: string
          enum: [NONE, ACTION, MINOR, MODERATE, MAJOR]
        forecastIssuedAt:
          type: string
          format: date-time
          description: The source's own forecast issue instant — the vintage this DRAFT is grounded in.
        likelihoodClass:
          type: string
          enum: [POSSIBLE, LIKELY, VERY_LIKELY]
          description: Absent when the source published no probability signal the threshold table covers.
        likelihoodRawValue:
          oneOf: [{ type: number }, { type: string }]
          description: The source value that produced the class, verbatim — a class never travels alone.
        likelihoodSourceField: { type: string }
        likelihoodMethod:
          type: string
          description: The classifier's own method string, verbatim.
        method:
          type: string
          description: How the lead time and expected crossing were arrived at.
        uncertainty:
          type: string
          description: What these figures do NOT claim.

    SourceRecord:
      type: object
      description: Canonical provenance record every datum anchors to (Art. XI).
      required: [id, source, adapter, fetchedAt, license, mode]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        adapter: { type: string }
        fetchedAt: { type: string, format: date-time }
        license: { type: string }
        mode:
          type: string
          enum: [LIVE, CACHED, MOCK, DB]

    AdapterHealth:
      type: object
      description: |
        Operational health of one configured source (adapter-contract §3; ADR-009). Drives the
        stale/unavailable UI badge (FR-2/UW2).

        `stale` and `degraded` are DERIVED VERDICTS this server computes, never claims copied from
        upstream. A literal circuit-breaker state (CLOSED/OPEN/HALF_OPEN) is deliberately ABSENT — see
        the `GET /health/adapters` description for why it cannot be observed from a request, and what is
        reported in its place.
      required: [adapterId, mode, fetchedAt, stale, degraded]
      properties:
        adapterId: { type: string, description: 'e.g. "firms" — the provenance sourceId.' }
        mode:
          type: string
          description: The EFFECTIVE rung the redundancy ladder served this source from.
          enum: [LIVE, CACHED, MOCK]
        fetchedAt:
          { type: string, description: "Fetch instant of this source's newest datum (ISO-8601)." }
        ageSec:
          type: integer
          minimum: 0
          description: Age of that datum in whole seconds. OMITTED when `fetchedAt` cannot be parsed.
        stale:
          type: boolean
          description: |
            True when `ageSec` exceeds the report's `staleAfterSec` — or when `fetchedAt` is unreadable
            (fails pessimistic: a broken timestamp must never render as a green badge).
        degraded:
          type: boolean
          description: True when the served rung is CACHED or MOCK — i.e. the ladder descended (Art. XVI).

    AdaptersHealthReport:
      type: object
      description: |
        Aggregate adapter-health report for one region — the `data` payload of `GET /health/adapters`
        (carried inside the standard response envelope like every other JSON response).
      required: [regionId, status, generatedAt, staleAfterSec, adapters, counts]
      properties:
        regionId: { type: string }
        status:
          type: string
          description: '`ok` only when EVERY adapter is LIVE and fresh; `degraded` otherwise.'
          enum: [ok, degraded]
        generatedAt:
          { type: string, format: date-time, description: 'Injected clock instant (Art. XII).' }
        staleAfterSec:
          type: integer
          description: |
            The staleness threshold applied to every row — the adapter-contract §5 default cache TTL
            (900 s), i.e. the point at which a degraded adapter's last-known-good copy is itself expired.
        adapters:
          type: array
          items: { $ref: '#/components/schemas/AdapterHealth' }
        counts:
          type: object
          description: Per-rung tallies over `adapters[]` (`live + cached + mock == total`).
          required: [total, live, cached, mock, stale]
          properties:
            total: { type: integer, minimum: 0 }
            live: { type: integer, minimum: 0 }
            cached: { type: integer, minimum: 0 }
            mock: { type: integer, minimum: 0 }
            stale: { type: integer, minimum: 0 }

    Alert:
      type: object
      description: |
        CAP/EDXL alert. An ACTUAL alert MUST carry `approvedBy` (Art. XIII); threshold-fired
        alerts are DRAFT only.
      required: [id, capStatus, category, severity, edxlKind]
      properties:
        id: { type: string, format: uuid }
        incidentId:
          type: [string, 'null']
          format: uuid
        capStatus:
          type: string
          enum: [DRAFT, ACTUAL]
        category:
          type: string
          enum: [Fire, Met, Safety]
        severity:
          type: string
          enum: [MINOR, MODERATE, SEVERE, EXTREME]
        area: { $ref: '#/components/schemas/Geometry' }
        edxlKind:
          type: string
          enum: [CAP, EDXL_RM, EDXL_SITREP]
        sentAt:
          type: [string, 'null']
          format: date-time
        approvedBy:
          type: [string, 'null']
          format: uuid
          description: APP_USER id of the approver. REQUIRED before capStatus=ACTUAL (Art. XIII).
        thresholdRuleId:
          type: [string, 'null']
          format: uuid
          description: |
            THRESHOLD_RULE that fired this alert, if it was threshold-triggered (DDL
            `alert.threshold_rule_id` FK; EV6 traceability). Null for manually-composed alerts.

    CapAlertCreate:
      type: object
      description: CAP v1.2 alert payload (subset of the canonical CAP elements).
      required: [status, msgType, category, severity, urgency, certainty, headline, area]
      properties:
        identifier:
          type: string
          description: CAP identifier; assigned by server if omitted.
        sender:
          type: string
          description: CAP sender identity (CAP_SENDER); defaults from config.
        sent:
          type: string
          format: date-time
        status:
          type: string
          enum: [Draft, Actual]
          description: |
            BEACON narrows CAP's `status` to `[Draft, Actual]` (cap-v1.2.schema.json + Art. XIII):
            threshold-fired/composed alerts start as Draft; only an approved alert becomes Actual.
            CAP's Exercise/System/Test statuses are intentionally not emitted by BEACON.
        msgType:
          type: string
          enum: [Alert, Update, Cancel, Ack, Error]
        scope:
          type: string
          enum: [Public, Restricted, Private]
          default: Public
        category:
          type: string
          enum:
            [Geo, Met, Safety, Security, Rescue, Fire, Health, Env, Transport, Infra, CBRNE, Other]
        event:
          type: string
        urgency:
          type: string
          enum: [Immediate, Expected, Future, Past, Unknown]
        severity:
          type: string
          enum: [Extreme, Severe, Moderate, Minor, Unknown]
        certainty:
          type: string
          enum: [Observed, Likely, Possible, Unlikely, Unknown]
        headline:
          type: string
        description:
          type: string
        instruction:
          type: string
        effective:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        incidentId:
          type: string
          format: uuid
        area:
          type: object
          description: CAP area block.
          required: [areaDesc]
          properties:
            areaDesc: { type: string }
            polygon: { $ref: '#/components/schemas/PolygonGeometry' }
            geocode:
              type: array
              items:
                type: object
                properties:
                  valueName: { type: string }
                  value: { type: string }
        approvedBy:
          type: string
          format: uuid
          description: REQUIRED when status=Actual (Art. XIII); otherwise rejected with 409.

    ThresholdRule:
      type: object
      description: |
        Declarative early-warning rule (Q5, ADR-014) as `GET /threshold-rules` serves it — the DOMAIN
        entity (`src/domain/threshold-rule.ts`) verbatim. Firing creates a DRAFT Alert only (Art. XIII).

        NB: `hysteresis`/`cooldown` are NUMBERS here (the entity's shape), not the duration TOKENS
        (`"15m"`) that `schemas/threshold-rule.schema.json` — an S03-era artifact — describes; `scope`
        is an optional region id, not a required uuid. This entry documents what the API actually
        returns. Reconciling that older JSON-Schema with the entity is tracked separately.
      required: [id, target, operator, value]
      properties:
        id: { type: string, description: 'Stable rule id (a slug, e.g. "ca-hazard-buffer-rule").' }
        target:
          type: string
          enum: [GAUGE_CATEGORY, HAZARD_BUFFER, FORECAST_GAUGE_CATEGORY]
        operator:
          type: string
          enum: [crosses, gte, enters]
        value:
          type: string
          description: e.g. MODERATE | <meters> | <infra_type>.
        scope:
          type: string
          description: Optional region id the rule is scoped to. Absent ⇒ deployment-wide.
        hysteresis:
          type: number
          minimum: 0
          description: Minimum dwell (anti-flap). Absent ⇒ none configured.
        cooldown:
          type: number
          minimum: 0
          description: De-dup window suppressing repeat fires. Absent ⇒ none configured.

    Resource:
      type: object
      required: [id, kind, status, org]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [CREW, ENGINE, AIRCRAFT, MEDICAL, SUPPLY]
        status:
          type: string
          enum: [AVAILABLE, ASSIGNED, OOS]
        geom: { $ref: '#/components/schemas/PointGeometry' }
        org:
          type: string
          description: Owning agency.

    ResourceCreate:
      type: object
      required: [kind, org]
      properties:
        kind:
          type: string
          enum: [CREW, ENGINE, AIRCRAFT, MEDICAL, SUPPLY]
        status:
          type: string
          enum: [AVAILABLE, ASSIGNED, OOS]
          default: AVAILABLE
        geom: { $ref: '#/components/schemas/PointGeometry' }
        org:
          type: string
          description: RESPONDER may only register for own org; EM for any.

    ResourceTask:
      type: object
      required: [id, resourceId, incidentId, status]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        status:
          type: string
          enum: [PROPOSED, TASKED, ENROUTE, ONSCENE, CLEARED]
        target: { $ref: '#/components/schemas/Geometry' }
        edxlRmRef:
          type: string
          description: Mutual-aid round-trip id this task is bound to.

    ResourceTaskCreate:
      type: object
      required: [resourceId, incidentId]
      properties:
        resourceId: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        status:
          type: string
          enum: [PROPOSED, TASKED, ENROUTE, ONSCENE, CLEARED]
          default: PROPOSED
        target: { $ref: '#/components/schemas/Geometry' }
        fromReportId:
          type: string
          format: uuid
          description: Optional originating report; MUST be VERIFIED (ST1) or request is 409.

    Shelter:
      type: object
      required: [id, geom, capacity, occupancy, status, org]
      properties:
        id: { type: string, format: uuid }
        geom: { $ref: '#/components/schemas/PointGeometry' }
        capacity: { type: integer }
        occupancy: { type: integer }
        status:
          type: string
          enum: [OPEN, FULL, CLOSED]
        org:
          type: string
          description: Agency-entered/seeded.

    EvacRoute:
      type: object
      required: [id, geom, avoidsHazard]
      properties:
        id: { type: string, format: uuid }
        incidentId:
          type: [string, 'null']
          format: uuid
        geom: { $ref: '#/components/schemas/LineStringGeometry' }
        avoidsHazard:
          type: boolean
          description: Whether the route deterministically avoids the hazard polygon.
        suggestedStart:
          type: [string, 'null']
          format: date-time
        engine:
          type: string
          enum: [ors, heuristic]
          description: >-
            Which engine produced the geometry — real road routing (OpenRouteService, behind
            FEATURE_ROUTING=ors) or the offline hazard-avoiding heuristic. Optional; a consumer
            that receives no engine shows no engine label (added 2026-08-10).
        distanceM:
          type: number
          minimum: 0
          description: >-
            The engine's own route length in metres — OpenRouteService's summary, or the heuristic
            rung's great-circle distance (labelled by `engine`). Optional; absent when the engine
            reported none (added 2026-09-14).
        durationSec:
          type: number
          minimum: 0
          description: >-
            The engine's own travel time in seconds — OpenRouteService's summary, or the heuristic
            rung's clearance estimate at the configured evacuation speed. Optional.
        steps:
          type: array
          items: { type: string }
          description: >-
            Turn-by-turn instructions VERBATIM from the routing engine (OpenRouteService). Absent for
            the heuristic rung, which has no turns and invents none.

    # RECONCILED 2026-08-01 (findings F-361/F-405). This schema was RIGHT and the implementation was wrong:
    # `destination` has been documented optional since S03 while `parseRoutes` hard-required it, so
    # POST /routes 400'd on every submit from the evacuation panel (which collects only an origin). The
    # server now honours the documented destination-less case. `profile` is marked NOT READ rather than
    # deleted, per the honest-limitations rule.
    RouteRequest:
      type: object
      required: [incidentId]
      properties:
        origin:
          allOf:
            - $ref: '#/components/schemas/Position'
          description: |
            Optional since 2026-09-14; if omitted, the route starts from the incident's own place — the
            centre of its hazard footprint, resolved server-side. An incident with no footprint is a 400.
            Present-but-malformed is a 400.
        destination:
          allOf:
            - $ref: '#/components/schemas/Position'
          description: |
            Optional; if omitted, the nearest **OPEN** shelter to the origin is the destination, chosen
            deterministically server-side (Art. XII — the client never ranks or picks). Present-but-malformed
            is a 400: silently ignoring a destination the caller meant would route them somewhere else.
            With no open shelter in range the response is a typed 404, never a route to nowhere (Art. XVI).
        incidentId:
          type: string
          description: Incident whose hazard polygon the route must avoid. Required.
        avoidHazard:
          type: boolean
          description: Optional override of hazard avoidance; defaults to the use-case's own policy.
        profile:
          type: string
          enum: [driving, walking]
          default: driving
          description: '**NOT READ (v1)** — no parser consumes it; the routing profile is not selectable yet.'

    AppUser:
      type: object
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [PUBLIC, RESPONDER, VERIFIER, EM]
        org: { type: string }

    AuditEvent:
      type: object
      description: |
        Append-only record of every state-changing action (CLARIFICATIONS §B.Q6). Cost-attribution
        fields (ADR-022, F19) are populated on each LLM/Vision/adapter model call and NULL on non-AI
        events; numbers are deterministic (tokens × tier rate, Art. XII). These map to the DDL columns
        `cost_tokens_in / cost_tokens_out / cost_usd / model_tier` (schemas/schema.sql · DOMAIN_MODEL §2).
      required: [id, action, target, at, hash]
      properties:
        id:
          {
            type: string,
            description: 'Chain-local surrogate id (e.g. "ae-1") — deliberately NOT part of the hashed payload.',
          }
        actorId:
          type: string
          description: |
            The server-derived acting identity. OPTIONAL: a system-originated event (a retention sweep,
            a scheduled emission) has no human actor, and inventing one would be the misattribution the
            audit trail exists to prevent.
        action: { type: string, description: 'Closed-vocabulary action token, e.g. ALERT_EMIT.' }
        target: { type: string, description: 'The entity acted on, e.g. "alert:ca-alert-draft-1".' }
        at: { type: string, format: date-time }
        evidenceDigest:
          type: string
          description: |
            Content address of a bulky evidence record held BESIDE the chain (governance ledger,
            ADR-034 §5) — the chain binds it cryptographically while staying small and PII-free.
        costTokensIn:
          type: [integer, 'null']
          description: Input tokens for the model call (DDL cost_tokens_in); null on non-AI events.
        costTokensOut:
          type: [integer, 'null']
          description: Output tokens for the model call (DDL cost_tokens_out); null on non-AI events.
        costUsd:
          type: [number, 'null']
          description: Deterministic cost = tokens × tier rate (DDL cost_usd, Art. XII); null on non-AI events.
        modelTier:
          type: [string, 'null']
          description: Model tier of the call (DDL model_tier); null on non-AI events.
          enum: [CLOUD, LOCAL, DETERMINISTIC, VISION, null]
        prevHash:
          type: string
          description: |
            Predecessor event hash — the tamper-evident link (ADR-017/022). ABSENT (omitted, not null) on
            the genesis event, which is how a client identifies the chain root. Over the wire the API
            omits absent optional fields rather than emitting `null`; the DDL column `prev_hash` is
            nullable, which is the same statement in SQL.
        hash:
          type: string
          description: |
            This event's hash = linkHash(prevHash, canonical(payload)) (DDL `hash`). Always present.
            `GET /audit-events` serves rows in CHAIN ORDER so `events[n].prevHash == events[n-1].hash`,
            and reports the server's own re-verification as `data.chainVerified` (fail-closed).

    # ---------------------------------------------------------------------------
    # EDXL interop (boundary serializations) + SSE stream event
    # ---------------------------------------------------------------------------

    EdxlRmMessage:
      type: object
      description: |
        EDXL-RM 1.0 mutual-aid message. This is the inline summary view of the boundary
        serialization; the FULL canonical schema (ContentObject/ResourceInformation/
        ResponseInformation/ScheduleInformation/…) is authoritative in
        `schemas/edxl-rm.schema.json`. `messageType` + `originatingMessageID` (round-trip
        correlation id) mirror that schema. The full message set covers the complete mutual-aid
        lifecycle (request → commit/response/offer → release/return).
      required: [messageType, originatingMessageID]
      properties:
        messageId:
          type: string
          description: Server-assigned round-trip id (echoed on read). Maps to EDXL-RM <MessageID>.
        messageType:
          type: string
          description: |
            EDXL-RM message type — the FULL OASIS RM 1.0 set (mirrors
            `schemas/edxl-rm.schema.json`).
          enum:
            - RequestResource
            - ResponseToRequestResource
            - RequisitionResource
            - CommitResource
            - RequestInformation
            - ResponseToRequestInformation
            - OfferUnsolicitedResource
            - ReleaseResource
            - RequestReturn
            - ResponseToRequestReturn
            - RequestQuote
            - ResponseToRequestQuote
            - RequestResourceDeploymentStatus
            - ResponseToRequestResourceDeploymentStatus
        messageContentType:
          type: string
          description: EDXL-RM <MessageContentType> — equals messageType (kept for spec fidelity).
        originatingMessageID:
          type: string
          description: |
            EDXL-RM <OriginatingMessageID> — round-trip CORRELATION id: the request and every
            commit/response/status reply that answers it share this value.
        precedingMessageID:
          type: string
          description: |
            EDXL-RM <PrecedingMessageID> — the message this one directly replies to; forms the
            reply chain within a round-trip (required on reply-type messages).
        sentDateTime:
          type: string
          format: date-time
        incidentId:
          type: string
          format: uuid
        resourceInformation:
          type: array
          description: |
            EDXL-RM ResourceInformation blocks mapped to canonical RESOURCE entities. Summary
            shape; see `schemas/edxl-rm.schema.json` $defs.resourceInformation for the full form.
          items:
            type: object
            properties:
              resourceInfoElementID: { type: string }
              resourceId: { type: string, format: uuid }
              typeStructure: { type: string }
              quantity: { type: integer }
              status: { type: string }

    EdxlRmRoundTrip:
      type: object
      description: The full request → commit → response chain for a mutual-aid exchange.
      required: [messageId, chain]
      properties:
        messageId: { type: string }
        chain:
          type: array
          items: { $ref: '#/components/schemas/EdxlRmMessage' }

    EdxlSitrepCreate:
      type: object
      required: [incidentId]
      properties:
        incidentId: { type: string, format: uuid }
        reportingPeriodStart:
          type: string
          format: date-time
        reportingPeriodEnd:
          type: string
          format: date-time
        narrative:
          type: string

    EdxlSitrep:
      type: object
      required: [id, incidentId, edxlVersion, generatedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        edxlVersion:
          type: string
          default: '1.0'
        generatedAt: { type: string, format: date-time }
        narrative: { type: string }

    StreamEvent:
      type: object
      description: JSON payload carried in the `data:` field of each SSE frame.
      required: [type, at]
      properties:
        type:
          type: string
          enum: [incident, exposure, report, resource, alert, heartbeat]
        regionId:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: Delta payload (generalized data only on the public channel — ST3).

    # ---------------------------------------------------------------------------
    # Sustainability disclosure (ADR-020) — mirrors schemas/sustainability-v05.schema.json
    # ---------------------------------------------------------------------------

    SustainabilityReport:
      type: object
      description: |
        One modeled energy/carbon report object served at `GET /.well-known/sustainability`
        (ADR-020; RFC `draft-besleaga-green-sustainability-wellknown-05`). Faithful to
        `schemas/sustainability-v05.schema.json`. Mandatory fields per the draft's "Mandatory
        Response Fields"; optional fields align with GHG Protocol scopes, GSF Software Carbon
        Intensity (ISO/IEC 21031:2024 = `sci-score`), and CSRD/ESRS-E1. BEACON publishes
        ESTIMATED / MODELED values (`measurement-method: third-party-modeled`,
        `methodology-uri` → docs/SUSTAINABILITY.md). Unknown fields are permitted (forward
        compatibility — clients MUST tolerate them).
      additionalProperties: true
      required:
        - version
        - updated
        - capabilities
        - provider
        - measurement-method
        - methodology-uri
        - reporting-period
        - energy-consumption
        - energy-unit
        - carbon-footprint
        - carbon-unit
      properties:
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Document schema version `major.minor` (e.g. '1.0', '1.1').
        updated:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the document was last updated (freshness anchor).
        capabilities:
          type: string
          enum: [basic, extended]
          description: Service level. `extended` indicates support for the optional query parameters.
        provider:
          type: string
          minLength: 1
          description: Entity operating the origin and publishing the metadata (e.g. 'BEACON (sustain@beacon.local)').
        measurement-method:
          type: string
          minLength: 1
          description: |
            Methodology label/reference (e.g. hardware-metered, hardware-estimated, cloud-billing,
            third-party-modeled). BEACON publishes `third-party-modeled` for the demo.
        methodology-uri:
          type: string
          format: uri-reference
          minLength: 1
          description: Link to the full calculation methodology. For BEACON this resolves to docs/SUSTAINABILITY.md.
        reporting-period:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
          description: Timeframe covered (RFC 3339 `YYYY | YYYY-MM | YYYY-MM-DD`; Basic defaults to the last full calendar month).
        energy-consumption:
          type: number
          minimum: 0
          description: Total energy consumed by the host (or target resource) during the reporting period.
        energy-unit:
          type: string
          enum: [Wh, kWh, MWh, GWh]
          description: Fixed literal energy unit (draft).
        carbon-footprint:
          type: number
          minimum: 0
          description: Total carbon impact expressed in `carbon-unit`.
        carbon-unit:
          type: string
          enum: [gCO2e, kgCO2e, mtCO2e]
          description: Fixed literal carbon unit (draft).
        target-path:
          type: string
          pattern: '^/'
          description: OPTIONAL. The resource path requested as `target` (e.g. '/api/v1/incidents').
        carbon-accounting:
          type: string
          enum: [location-based, market-based]
          description: OPTIONAL. GHG Protocol accounting basis (demo uses location-based).
        scope-1:
          type: number
          minimum: 0
          description: OPTIONAL. Estimated Scope 1 (direct) carbon emissions (≈0 for BEACON — no direct combustion).
        scope-2:
          type: number
          minimum: 0
          description: OPTIONAL. Estimated Scope 2 (indirect / purchased-energy) carbon emissions.
        scope-3:
          type: number
          minimum: 0
          description: OPTIONAL. Estimated Scope 3 (value-chain) carbon emissions.
        sci-score:
          type: number
          minimum: 0
          description: OPTIONAL. Software Carbon Intensity per GSF / ISO/IEC 21031:2024 = ((E*I)+M)/R.
        functional-unit:
          type: string
          minLength: 1
          description: OPTIONAL. SCI normalization unit (e.g. 'per-thousand-COP-requests'); documented in methodology-uri.
        carbon-intensity-gCO2-per-kWh:
          type: number
          minimum: 0
          description: OPTIONAL. Weighted grid carbon intensity in grams CO2 per kWh.
        estimated-annual-emissions-kgCO2:
          type: number
          minimum: 0
          description: OPTIONAL. Estimated annual emissions attributable to the origin (kg CO2e).
        renewable-energy:
          type: number
          minimum: 0
          maximum: 100
          description: OPTIONAL. Percentage of energy from sustainable renewable sources (0–100).
        verifiable-attestation-uri:
          type: string
          format: uri-reference
          description: OPTIONAL. Link to a verifiable credential / attestation (anti-greenwashing). NOT proof of the metrics.
        disclosure-uri:
          type: string
          format: uri-reference
          description: OPTIONAL (schema 1.1+). Discovery link to a machine-readable disclosure index (e.g. carbon.txt). Not proof of the metrics.
