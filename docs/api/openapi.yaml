        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /pre-positioning:
    get:
      operationId: getPrePositioning
      tags: [Resources]
      summary: Advisory resource/shelter pre-positioning suggestions near the projected hazard extent
      description: |
        W2d (PRD flagship-4 "pre-positioning from predictions") — the deterministic
        `suggestPrePositioning` use-case (`src/application/pre-positioning/pre-positioning.ts`) ranks
        AVAILABLE resources + OPEN shelters with spare capacity that sit NEAR — but NOT inside — the
        incident's projected hazard extent (the `Prediction` geometry). Engine SUGGESTS, a human
        DECIDES (Art. XII/XIII) — this is advisory-only and never auto-tasks a resource. Role
        RESPONDER+ (same gate as `/resources`). Added to this document 2026-07-15 (W5 audit-debt
        sweep); the route has been served since W2d but was missing from the spec (OpenAPI drift).
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Advisory suggestions (`data` is an OBJECT, not an array). `extentAvailable:false` + an
            empty `suggestions[]` — never a dead-end (Art. XVI) — when no projected hazard extent is
            known yet for the incident.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [method, extentAvailable, suggestions]
                        properties:
                          method:
                            { type: string, description: 'Deterministic ranking method label.' }
                          extentAvailable:
                            type: boolean
                            description: False when no projected hazard extent exists yet for the incident.
                          suggestions:
                            type: array
                            items:
                              type: object
                              required: [kind, refId, distanceMeters]
                              properties:
                                kind: { type: string, enum: [RESOURCE, SHELTER] }
                                refId: { type: string }
                                distanceMeters: { type: number }
                                resourceKind:
                                  { type: string, description: 'Present for kind=RESOURCE.' }
                                capacity:
                                  { type: integer, description: 'Present for kind=SHELTER.' }
                                occupancy:
                                  { type: integer, description: 'Present for kind=SHELTER.' }
                      meta:
                        type: object
                        properties:
                          note: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /alerts:
    get:
      operationId: listAlerts
      tags: [Alerts]
      summary: List the computed DRAFT alert queue
      description: |
        FR-11 / T-387 / Art. XIII. The DRAFT alerts the threshold engine COMPUTED from the current
        readings (never hand-seeded literals) — the review queue for the HITL approve gate. **VERIFIER+
        only** (SPEC §2.2: the alert/CAP family is VERIFIER+). Every row is `state=DRAFT`; promotion to
        ACTUAL is the separate authenticated `POST /alerts/{id}/approve` (this read never emits). Response
        carries non-empty `provenance[]` + `freshness` (F1).
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: The DRAFT alert queue (object with an `alerts[]` array) + provenance + freshness.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [alerts]
                        properties:
                          alerts:
                            type: array
                            items: { $ref: '#/components/schemas/AlertQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createAlert
      tags: [Alerts]
      summary: Emit a CAP v1.2 alert
      description: |
        EV6/EV10 / FR-9 / Art. XIII. Produces a CAP v1.2 alert. An ACTUAL alert REQUIRES an
        approver (`approvedBy`); without one the alert is rejected as **409**. Threshold-fired
        alerts are DRAFT only and never auto-promoted. BEACON validates CAP but never performs
        live IPAWS origination. Role VERIFIER or EM. Writes AUDIT_EVENT.
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        description: CAP v1.2 alert payload.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapAlertCreate' }
      responses:
        '201':
          description: Alert created (DRAFT or, with an approver, ACTUAL).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: ACTUAL requested without an approver (Art. XIII) — rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseEnvelope' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /alerts/{id}/approve:
    post:
      operationId: approveAlert
      tags: [Alerts]
      summary: Approve a DRAFT alert → ACTUAL (the HITL emit gate)
      description: |
        FR-11 / Art. XIII. Promotes a threshold-fired **DRAFT** alert to **ACTUAL** with the
        authenticated approver recorded as `approvedBy`, emits it through the alert sink, and — when
        the Telegram channel is configured live (ADR-026) — broadcasts a PII-free digest to the
        subscriber registry strictly AFTER the emit succeeds. A broadcast failure is audited but
        never fails the approval (no 5xx). Role VERIFIER or EM. Writes AUDIT_EVENT.
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The DRAFT alert id.
      responses:
        '201':
          description: Alert approved, emitted as ACTUAL (and broadcast when the channel is live).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The alert is not in DRAFT state (already approved/expired) — rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseEnvelope' }

  # ADDED 2026-08-01 (finding F-411). This route IS served — feature-router.ts dispatches it to
  # `handleAlertAllClear` (interop.ts) — but it had no entry here at all. The audit that found five
  # DOCUMENTED-BUT-UNSERVED paths (F-323) also found this one gap in the opposite direction: SERVED BUT
  # UNDOCUMENTED. Both are the same failure to keep one contract, and both are equally misleading.
  /alerts/{id}/all-clear:
    post:
      operationId: authorAllClear
      tags: [Alerts]
      summary: Author an ALL-CLEAR follow-up to a public alert (DRAFT)
      description: |
        D3.2 / ADR-036 §2 / Art. XIII. Authors a CAP **CANCEL** message referencing an alert that was
        actually made public, and saves it as a **DRAFT**. It is NOT emitted here: the all-clear goes back
        through the SAME `POST /alerts/{id}/approve` HITL gate as the warning it clears, so standing down
        the public is as deliberate an act as warning them. Role VERIFIER or EM.
      x-required-role: VERIFIER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The ACTUAL (already-public) alert being cleared.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional operator-authored warning text; sensible CAP defaults are derived otherwise.
              properties:
                headline: { type: string }
                description: { type: string }
                instruction: { type: string }
      responses:
        '201':
          description: |
            ALL-CLEAR authored as a **DRAFT** CANCEL referencing the original. Nothing was sent, and the
            response says so rather than leaving it to be inferred: `meta.emitted=false`,
            `meta.requiresApproval=true`, and `meta.references[]` carries the original alert id(s).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          alert: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The alert was never made public (`cap_status` ≠ ACTUAL) — there is nothing to clear. Clearing a
            warning nobody received would itself be a misleading public message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseEnvelope' }

  /edxl/rm:
    post:
      operationId: postEdxlResourceMessage
      tags: [Interop]
      summary: Import/exchange an EDXL-RM mutual-aid message
      description: |
        EV10 / FR-9 / U1. Full mutual-aid round-trip — accepts any EDXL-RM 1.0 message in the
        lifecycle (RequestResource, CommitResource, ResponseToRequestResource,
        OfferUnsolicitedResource, ReleaseResource, RequestReturn, …). The message is
        mapped to canonical RESOURCE/RESOURCE_TASK entities (anti-corruption boundary) and
        assigned a server `messageId` for the round-trip. Role RESPONDER (own-org;
        BFLA/org-ownership checked, T2.8) or EM (CLARIF §B.Q6, SPEC §2.2/§7.2). Writes AUDIT_EVENT.
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdxlRmMessage' }
      responses:
        '201':
          description: EDXL-RM message accepted; round-trip id assigned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EdxlRmMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /edxl/rm/{id}:
    parameters:
      - $ref: '#/components/parameters/EdxlMessageId'
