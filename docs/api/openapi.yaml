  /health/adapters:
    get:
      operationId: getAdapterHealth
      tags: [System]
      summary: Per-adapter operational health (effective mode, freshness age, ladder verdict)
      description: |
        SERVED (`src/adapters/channels/http/routes/adapter-health.ts` → `handleAdapterHealth`, wired in
        the feature router's 2-segment GET table). Backs the "stale/unavailable" UI badge (FR-2 / UW2)
        and the registry health view (adapter-contract §3; ADR-009).

        **Role RESPONDER+ — deliberately NOT public.** `GET /sources` remains the PUBLIC provenance
        catalogue (per-source mode + freshness). This endpoint adds the deployment's DEGRADATION POSTURE
        — which sources are on a fallback rung right now, which are stale — which is operational
        reconnaissance about the deployment rather than data about the emergency. The earlier `PUBLIC`
        marking here (and in SPEC §2.2) described a route that returned 404; the role is tightened as it
        is implemented.

        It DOES return the standard `{data, provenance[], freshness}` envelope. The former "operational
        endpoint, not a data endpoint" special-casing is withdrawn: one envelope on every JSON response
        is the cheaper contract, and this response genuinely has provenance (the region's sources).

        **Honest limitation (states the boundary rather than faking it).** A literal cockatiel breaker
        state (`CLOSED|OPEN|HALF_OPEN`) is NOT reported, because it cannot be observed from a request:
        `ManagedBreaker` lives inside a per-composition adapter instance and the live composition builds
        and discards those per seed assembly — there is no process-wide breaker registry. What IS
        reported is the breaker's OUTCOME: `degraded` (the served rung is CACHED/MOCK, i.e. the ladder
        descended) and `stale` (the newest datum is older than `staleAfterSec`, the adapter-contract §5
        default cache TTL). Reporting a literal state requires the composition root to retain the
        registry — tracked in `docs/audit/UNIMPLEMENTED_REGISTER.md`, not papered over here.

        `?regionId=` selects the region whose configured sources are reported (default region otherwise).
      x-required-role: RESPONDER
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: regionId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: |
            Adapter health report — aggregate `status`, per-adapter effective mode + freshness age +
            derived `stale`/`degraded` verdicts, and rung counts. Always **200** for an authorized
            caller, even when every adapter is degraded: a monitoring endpoint that fails when the thing
            it monitors is unhealthy cannot be used to see that it is unhealthy (Art. XVI).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdaptersHealthReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

